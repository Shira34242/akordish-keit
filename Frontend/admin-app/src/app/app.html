<div *ngIf="showGate" class="gate-overlay">
  <div class="gate-box" dir="rtl">
    <h2>אקורדישקייט</h2>
    <p>האתר בשלב בדיקות - הכנס סיסמה להמשך</p>
    <input [(ngModel)]="gateInput" type="password" placeholder="סיסמה" (keyup.enter)="submitGate()" autofocus />
    <p *ngIf="gateError" class="gate-error">{{ gateError }}</p>
    <button (click)="submitGate()" [disabled]="gateSubmitting">
      {{ gateSubmitting ? 'בודק...' : 'כניסה' }}
    </button>
  </div>
</div>

<div class="app-container" *ngIf="!showGate && !gateChecking">
  <router-outlet></router-outlet>
  <app-site-alerts></app-site-alerts>

  @defer (when isAddSongModalOpen) {
    <app-add-song-modal
      *ngIf="isAddSongModalOpen"
      [editMode]="editMode"
      [songToEdit]="songToEdit"
      [songPrefill]="songPrefill"
      [flowMode]="songModalFlowMode"
      (close)="closeAddSongModal()"
      (songAdded)="onSongAdded()">
    </app-add-song-modal>
  }

  @defer (when reportModal.isOpen) {
    <app-report-modal
      [isOpen]="reportModal.isOpen"
      [contentType]="reportModal.contentType"
      [contentId]="reportModal.contentId"
      [contentTitle]="reportModal.contentTitle"
      (close)="closeReportModal()">
    </app-report-modal>
  }
</div>
