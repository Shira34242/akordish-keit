<div class="admin-container">
    <!-- Admin Header -->
    <header class="admin-header">
        <div class="header-inner">
            <div class="header-right">
                <div class="logo-area">
                    <span class="material-symbols-outlined logo-icon">music_note</span>
                    <span class="logo-text">אקורדישקייט</span>
                    <span class="admin-badge">ניהול</span>
                </div>
            </div>

            <div class="header-center">
                <nav class="admin-nav">
                    <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
                        <span>מרכז בקרה</span>
                    </a>
                    <div class="nav-group" routerLinkActive="active expanded" [routerLinkActiveOptions]="{ exact: false }">
                        <a routerLink="/admin/users" class="nav-item nav-parent">
                            <span>משתמשים</span>
                        </a>
                        <div class="nav-submenu" aria-label="סוגי משתמשים">
                            <a routerLink="/admin/users/clients" routerLinkActive="active-sub" class="sub-nav-item">לקוחות</a>
                            <a routerLink="/admin/users/teachers" routerLinkActive="active-sub" class="sub-nav-item">מורים</a>
                            <a routerLink="/admin/users/service-providers" routerLinkActive="active-sub" class="sub-nav-item">בעלי מקצוע</a>
                            <a routerLink="/admin/users/artists" routerLinkActive="active-sub" class="sub-nav-item">אומנים</a>
                        </div>
                    </div>
                    <div class="nav-group" routerLinkActive="active expanded" [routerLinkActiveOptions]="{ exact: false }">
                        <a routerLink="/admin/content" class="nav-item nav-parent">
                            <span>תוכן</span>
                        </a>
                        <div class="nav-submenu" aria-label="סוגי תוכן">
                            <a routerLink="/admin/content/songs" routerLinkActive="active-sub" class="sub-nav-item">אקורדים</a>
                            <a routerLink="/admin/content/articles" routerLinkActive="active-sub" class="sub-nav-item">כתבות</a>
                            <a routerLink="/admin/content/featured" routerLinkActive="active-sub" class="sub-nav-item">מרכזי</a>
                            <a routerLink="/admin/content/news-sections" routerLinkActive="active-sub" class="sub-nav-item">פסי חדשות</a>
                            <a routerLink="/admin/content/ticker" routerLinkActive="active-sub" class="sub-nav-item">פס הירו</a>
                            <a routerLink="/admin/content/events" routerLinkActive="active-sub" class="sub-nav-item">הופעות</a>
                            <a routerLink="/admin/content/stats" routerLinkActive="active-sub" class="sub-nav-item">סטטיסטיקה</a>
                        </div>
                    </div>
                    <a routerLink="/admin/advertising" routerLinkActive="active" class="nav-item">
                        <span>פרסום</span>
                    </a>
                    <div class="nav-group" routerLinkActive="active expanded" [routerLinkActiveOptions]="{ exact: false }">
                        <a routerLink="/admin/notifications" class="nav-item nav-parent">
                            <span>התראות</span>
                        </a>
                        <div class="nav-submenu" aria-label="סוגי התראות">
                            <a routerLink="/admin/notifications/messages" routerLinkActive="active-sub" class="sub-nav-item">צ׳אטים</a>
                            <a routerLink="/admin/notifications/reports" routerLinkActive="active-sub" class="sub-nav-item">דיווחים</a>
                        </div>
                    </div>
                    <a routerLink="/admin/system" routerLinkActive="active" class="nav-item">
                        <span>מערכת</span>
                    </a>
                </nav>
            </div>

            <div class="header-left">
                <button class="btn-back-site" (click)="goBackToSite()">
                    <span class="material-symbols-outlined">arrow_forward</span>
                    <span>חזרה לאתר</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="admin-main">
        <router-outlet></router-outlet>
    </main>

    <!-- Admin Footer -->
    <footer class="admin-footer">
        <p>© 2025 אקורדישקייט - מערכת ניהול מתקדמת</p>
    </footer>
</div>
