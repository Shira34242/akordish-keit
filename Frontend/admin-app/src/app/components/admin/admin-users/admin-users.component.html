<div class="dashboard-container" dir="rtl">

  <!-- Page Header -->
  <div class="page-header">
    <h1>מרכז בקרה</h1>
    <p class="subtitle">סטטיסטיקות מערכת ומשתמשים אחרונים</p>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card" *ngFor="let stat of stats">
      <div class="stat-emoji">{{ stat.icon }}</div>
      <div class="stat-value">{{ stat.value | number }}</div>
      <div class="stat-label">{{ stat.label }}</div>
    </div>
  </div>

  <!-- Recent Joins -->
  <div class="recent-card">
    <h2 class="card-title">
      <span class="material-icons">person_add</span>
      הצטרפו לאחרונה
    </h2>

    <div class="recent-list" *ngIf="recentJoins.length > 0">
      <div class="recent-item" *ngFor="let join of recentJoins">
        <div class="recent-avatar">
          <img
            *ngIf="join.profileImageUrl"
            [src]="join.profileImageUrl"
            [alt]="join.name"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"
          />
          <span class="avatar-initials">
            {{ (join.name || '?').charAt(0).toUpperCase() }}
          </span>
        </div>
        <div class="recent-info">
          <div class="recent-name">{{ join.name }}</div>
          <div class="recent-type">{{ join.type }}</div>
        </div>
        <div class="recent-meta">
          <span class="role-badge">{{ join.type }}</span>
          <span class="recent-date">{{ join.date | date: 'dd/MM/yyyy' }}</span>
        </div>
      </div>
    </div>

    <div class="empty-state" *ngIf="recentJoins.length === 0">
      <span class="material-icons empty-icon">group</span>
      <p>אין משתמשים חדשים</p>
    </div>
  </div>

</div>
