<div class="management-layout">
    <div class="section-switcher" *ngIf="!state.hideSwitcher">
        <div class="section-copy">
            <h1>{{ state.title }}</h1>
            <p class="subtitle">{{ state.subtitle }}</p>
        </div>

        <div class="section-action">
            <div class="smart-import-action" *ngIf="isSongsSection">
                <button
                    type="button"
                    class="smart-import-toggle"
                    (click)="toggleSmartImport()"
                    title="הוספה משליפה מלינק"
                    [attr.aria-expanded]="smartImportOpen"
                    aria-label="הוספה משליפה מלינק">
                    <span class="material-icons">link</span>
                </button>

                <div class="smart-import-popover" *ngIf="smartImportOpen">
                    <app-smart-add
                        [compactSongOnly]="true"
                        (completed)="smartImportOpen = false">
                    </app-smart-add>
                </div>
            </div>

            <button *ngIf="state.actionLabel" type="button" class="primary-action" (click)="onPrimaryAction()">
                {{ state.actionLabel }}
            </button>
        </div>
    </div>

    <div class="layout-content">
        <router-outlet></router-outlet>
    </div>
</div>
