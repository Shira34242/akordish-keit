<div class="sections-container" dir="rtl">

  <div class="page-header">
    <div>
      <h1>ניהול קטגוריות לדפים</h1>
      <p class="subtitle">בחירת קטגוריות נפרדת לכל דף באתר</p>
    </div>
  </div>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>טוען הגדרות...</p>
  </div>

  <div *ngIf="!loading" class="page-settings-list">
    <section *ngFor="let page of pageSettings" class="page-setting-card">
      <div class="page-setting-header">
        <div class="page-title-group">
          <span class="page-icon material-symbols-outlined">{{ page.icon }}</span>
          <div>
            <h2>{{ page.title }}</h2>
            <span class="selection-count">{{ page.categoryIds.length }} קטגוריות נבחרו</span>
          </div>
        </div>
      </div>

      <div class="category-picker" [class.empty]="getCategoriesForPage(page).length === 0">
        <button
          *ngFor="let cat of getCategoriesForPage(page)"
          type="button"
          class="category-chip"
          [class.selected]="isPageCategorySelected(page, cat.id)"
          (click)="togglePageCategory(page, cat.id)">
          <span class="material-symbols-outlined">
            {{ isPageCategorySelected(page, cat.id) ? 'check_circle' : 'radio_button_unchecked' }}
          </span>
          {{ cat.name }}
        </button>

        <p *ngIf="getCategoriesForPage(page).length === 0" class="empty-category-text">
          אין קטגוריות זמינות לדף הזה
        </p>
      </div>

      <div class="page-setting-footer">
        <span class="selection-summary">{{ getSelectionSummary(page) }}</span>
        <button class="btn-save" (click)="savePageSetting(page)" [disabled]="page.saving">
          <span class="material-symbols-outlined" *ngIf="!page.saving">save</span>
          <span class="material-symbols-outlined spinning" *ngIf="page.saving">hourglass_empty</span>
          {{ page.saving ? 'שומר...' : 'שמור לדף' }}
        </button>
      </div>
    </section>
  </div>

</div>
