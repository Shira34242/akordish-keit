<div class="form-page podcast-episode-page" dir="rtl">
  <div class="form-header series-form-header">
    <button type="button" class="back-btn" (click)="goBack()">
      <span class="material-icons">arrow_forward</span>
      חזרה
    </button>
    <div>
      <span class="modal-kicker">{{ selectedPodcastName }}</span>
      <h1>{{ isEditMode ? 'עריכת פרק' : 'פרק חדש' }}</h1>
    </div>
  </div>

  <div *ngIf="loading" class="state-box">טוען פרק...</div>

  <form *ngIf="!loading" class="content-form episode-form" (ngSubmit)="onSubmit()">
    <section class="episode-link-section">
      <div class="form-group">
        <label for="episode-source-url">קישור לפרק</label>
        <input
          id="episode-source-url"
          type="url"
          [(ngModel)]="episode.sourceUrl"
          name="sourceUrl"
          placeholder="https://youtube.com/..."
          required
          (input)="onSourceUrlInput()" />
      </div>
      <span class="preview-label">{{ sourceTitleLoading ? 'שולף פרטים...' : detectedPlatform }}</span>
    </section>

    <section class="series-main-card episode-main-card">
      <section class="image-card" [class.has-image]="previewThumbnailUrl">
        <div
          class="image-preview"
          *ngIf="previewThumbnailUrl"
          [style.background-image]="'url(' + previewThumbnailUrl + ')'">
          <button type="button" class="image-clear" (click)="clearThumbnail()" aria-label="מחיקת תמונה" title="מחיקת תמונה">
            <span class="material-icons">close</span>
          </button>
        </div>

        <div class="image-empty" *ngIf="!previewThumbnailUrl">
          <span class="material-icons" aria-hidden="true">add_photo_alternate</span>
          <strong>תמונת הפרק</strong>
          <small>תישלף מיוטיוב, או שאפשר להדביק קישור / להעלות</small>
        </div>

        <app-file-upload-input
          inputId="episode-thumbnail-url"
          [(url)]="episode.thumbnailUrl"
          placeholder="קישור לתמונה"
          accept="image/*"
          [showPreview]="false"
        ></app-file-upload-input>
      </section>

      <div class="series-details episode-details">
        <div class="form-group">
          <label for="episode-title">שם הפרק</label>
          <input
            id="episode-title"
            type="text"
            [(ngModel)]="episode.title"
            name="title"
            required
            (input)="onTitleInput()" />
        </div>

        <div class="form-group">
          <label for="episode-podcast">סדרה</label>
          <select id="episode-podcast" [(ngModel)]="episode.podcastId" name="podcastId" required (change)="onPodcastChange()">
            <option *ngFor="let podcast of podcasts" [ngValue]="podcast.id">{{ podcast.name }}</option>
          </select>
        </div>

        <div class="form-group compact-number">
          <label for="episode-number">מספר פרק</label>
          <input
            id="episode-number"
            type="number"
            [(ngModel)]="episode.episodeNumber"
            name="episodeNumber"
            min="0"
            (input)="onEpisodeNumberInput()" />
        </div>

        <label class="checkbox-label primary-status">
          <input type="checkbox" [(ngModel)]="episode.isActive" name="isActive" />
          מוצג באתר
        </label>
      </div>
    </section>

    <button type="button" class="advanced-toggle" (click)="toggleAdvanced()">
      <span>{{ advancedOpen ? 'הסתרת הגדרות נוספות' : 'הגדרות נוספות שלא חובה' }}</span>
      <span class="material-icons" aria-hidden="true">{{ advancedOpen ? 'expand_less' : 'expand_more' }}</span>
    </button>

    <section class="advanced-section episode-advanced-section" *ngIf="advancedOpen">
      <div class="form-group">
        <label for="episode-slug">כתובת ידידותית</label>
        <input id="episode-slug" type="text" [(ngModel)]="episode.slug" name="slug" placeholder="נוצר אוטומטית אם משאירים ריק" />
      </div>

      <div class="form-group">
        <label for="episode-description">תיאור</label>
        <textarea id="episode-description" [(ngModel)]="episode.description" name="description" rows="4"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="episode-embed-url">קישור הטמעה ידני</label>
          <input id="episode-embed-url" type="url" [(ngModel)]="episode.embedUrl" name="embedUrl" placeholder="לא חובה" />
        </div>
        <div class="form-group">
          <label for="episode-platform">פלטפורמה</label>
          <input id="episode-platform" type="text" [(ngModel)]="episode.platform" name="platform" placeholder="נשאר ריק לזיהוי אוטומטי" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="episode-published-at">תאריך פרסום</label>
          <input id="episode-published-at" type="datetime-local" [(ngModel)]="episode.publishedAt" name="publishedAt" />
        </div>
        <div class="form-group">
          <label for="episode-display-order">סדר הצגה</label>
          <input id="episode-display-order" type="number" [(ngModel)]="episode.displayOrder" name="displayOrder" min="0" />
        </div>
      </div>

      <div class="form-group">
        <label>תיוג תוכן</label>
        <div class="profile-search-wrapper">
          <div *ngIf="selectedProfile" class="selected-profile-display">
            <img *ngIf="selectedProfile.imageUrl" [src]="selectedProfile.imageUrl" [alt]="selectedProfile.displayName" class="profile-thumb" />
            <span>{{ selectedProfile.displayName }}</span>
            <button type="button" class="btn-clear-profile" (click)="clearProfile()">×</button>
          </div>

          <div class="form-row" *ngIf="!selectedProfile">
            <div class="form-group">
              <select [(ngModel)]="profileTypeFilter" (change)="onProfileFilterChange()" name="profileTypeFilter">
                <option value="all">כולם</option>
                <option value="teacher">מורים</option>
                <option value="serviceProvider">נותני שירות</option>
                <option value="artist">אמנים</option>
                <option value="user">חברים רגילים</option>
              </select>
            </div>
            <div class="form-group">
              <input
                type="text"
                [(ngModel)]="profileSearchQuery"
                name="profileSearch"
                placeholder="חפש משתמש או פרופיל..."
                (input)="onProfileSearchInput()"
                (focus)="showProfileDropdown = true" />
            </div>
          </div>

          <div class="profile-dropdown" *ngIf="showProfileDropdown">
            <div *ngIf="profileSearchLoading">מחפש...</div>
            <div
              *ngFor="let p of profileSearchResults"
              class="profile-dropdown-item"
              (click)="selectProfile(p)">
              <img *ngIf="p.imageUrl" [src]="p.imageUrl" [alt]="p.displayName" />
              <span>{{ p.displayName }}</span>
            </div>
            <div *ngIf="!profileSearchLoading && profileSearchResults.length === 0 && profileSearchQuery">לא נמצאו תוצאות</div>
          </div>
        </div>
      </div>
    </section>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="goBack()" [disabled]="saving">חזרה</button>
      <button type="submit" class="btn-submit" [disabled]="saving">{{ saving ? 'שומר...' : 'שמירה' }}</button>
    </div>
  </form>
</div>
