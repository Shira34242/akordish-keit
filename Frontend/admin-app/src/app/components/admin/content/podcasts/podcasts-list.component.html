<div class="podcast-admin" dir="rtl">
  <section class="series-manager">
    <div class="section-header">
      <div>
        <h2>סדרות פודקאסטים</h2>
        <span>{{ podcasts.length }} סדרות קיימות</span>
      </div>
    </div>

    <div class="admin-series-row">
      <div class="admin-series-track">
        <button type="button" class="admin-series-card add-card" (click)="createPodcast()" aria-label="הוספת סדרה חדשה">
          <span class="admin-series-image add-card__image">
            <span class="material-icons" aria-hidden="true">add</span>
          </span>
          <strong>סדרה חדשה</strong>
        </button>

        <button
          type="button"
          class="admin-series-card"
          *ngFor="let podcast of podcasts"
          [class.active]="isSeriesSelected(podcast)"
          (click)="selectSeries(podcast)"
          [attr.aria-label]="podcast.name">
          <span class="admin-series-image" [style.background-image]="podcast.imageUrl ? 'url(' + podcast.imageUrl + ')' : ''">
            <span *ngIf="!podcast.imageUrl" class="material-icons">podcasts</span>
            <span class="series-status-dot" [class.inactive]="!podcast.isActive"></span>
          </span>
          <strong>{{ podcast.name }}</strong>
          <small>{{ podcast.episodeCount }} פרקים</small>
        </button>
      </div>
    </div>
  </section>

  <section class="episodes-manager" *ngIf="selectedSeriesPodcast">
    <div class="section-header">
      <div>
        <h2>{{ selectedSeriesPodcast.name }}</h2>
        <span>ניהול פרקים בסדרה</span>
      </div>
      <div class="section-actions">
        <div class="view-toggle" aria-label="תצוגת פרקים">
          <button type="button" [class.active]="seriesEpisodeViewMode === 'grid'" (click)="setSeriesEpisodeView('grid')" title="תצוגת גריד">
            <span class="material-icons">grid_view</span>
          </button>
          <button type="button" [class.active]="seriesEpisodeViewMode === 'list'" (click)="setSeriesEpisodeView('list')" title="תצוגת רשימה">
            <span class="material-icons">view_list</span>
          </button>
        </div>
        <a class="icon-btn" [routerLink]="['/podcasts', selectedSeriesPodcast.slug]" target="_blank" title="תצוגה באתר">
          <span class="material-icons">open_in_new</span>
        </a>
        <button type="button" class="icon-btn" (click)="editPodcast(selectedSeriesPodcast)" title="עריכת סדרה">
          <span class="material-icons">edit</span>
        </button>
        <button type="button" class="icon-btn danger" (click)="deletePodcast(selectedSeriesPodcast)" title="מחיקת סדרה">
          <span class="material-icons">delete</span>
        </button>
      </div>
    </div>

    <div *ngIf="seriesEpisodesLoading" class="state-box">טוען פרקים...</div>

    <div class="series-episodes-grid" *ngIf="!seriesEpisodesLoading && seriesEpisodeViewMode === 'grid'">
      <button type="button" class="episode-tile add-card" (click)="createEpisodeForSeries(selectedSeriesPodcast)" aria-label="הוספת פרק לסדרה">
        <span class="episode-tile__image add-card__image">
          <span class="material-icons" aria-hidden="true">add</span>
        </span>
        <strong>פרק חדש</strong>
        <small>בסדרה הזו</small>
      </button>

      <article class="episode-tile" *ngFor="let episode of selectedSeriesEpisodes">
        <button type="button" class="episode-tile__main" (click)="editEpisode(episode)" [attr.aria-label]="'עריכת ' + episode.title">
          <span class="episode-tile__image" [style.background-image]="episode.thumbnailUrl ? 'url(' + episode.thumbnailUrl + ')' : ''">
            <span *ngIf="!episode.thumbnailUrl" class="material-icons">play_circle</span>
          </span>
          <strong>{{ episode.title }}</strong>
          <small>
            <ng-container *ngIf="episode.episodeNumber">פרק {{ episode.episodeNumber }} · </ng-container>
            {{ formatDate(episode.publishedAt) }}
          </small>
        </button>

        <div class="tile-actions">
          <span class="badge" [class.inactive]="!episode.isActive">{{ getStatusLabel(episode.isActive) }}</span>
          <button type="button" class="icon-btn" (click)="editEpisode(episode)" title="עריכה">
            <span class="material-icons">edit</span>
          </button>
          <button type="button" class="icon-btn" (click)="duplicateEpisode(episode)" title="שכפול">
            <span class="material-icons">content_copy</span>
          </button>
          <button type="button" class="icon-btn danger" (click)="deleteEpisode(episode)" title="מחיקה">
            <span class="material-icons">delete</span>
          </button>
        </div>
      </article>

      <div *ngIf="selectedSeriesEpisodes.length === 0" class="state-box empty-series">אין עדיין פרקים בסדרה הזו</div>
    </div>

    <div class="series-episodes-list" *ngIf="!seriesEpisodesLoading && seriesEpisodeViewMode === 'list'">
      <button type="button" class="episode-list-row add-card" (click)="createEpisodeForSeries(selectedSeriesPodcast)" aria-label="הוספת פרק לסדרה">
        <span class="episode-list-row__thumb add-card__image">
          <span class="material-icons" aria-hidden="true">add</span>
        </span>
        <span class="episode-list-row__copy">
          <strong>פרק חדש</strong>
          <small>בסדרה הזו</small>
        </span>
      </button>

      <article class="episode-list-row" *ngFor="let episode of selectedSeriesEpisodes">
        <button type="button" class="episode-list-row__main" (click)="editEpisode(episode)" [attr.aria-label]="'עריכת ' + episode.title">
          <span class="episode-list-row__thumb" [style.background-image]="episode.thumbnailUrl ? 'url(' + episode.thumbnailUrl + ')' : ''">
            <span *ngIf="!episode.thumbnailUrl" class="material-icons">play_circle</span>
          </span>
          <span class="episode-list-row__copy">
            <strong>{{ episode.title }}</strong>
            <small>
              <ng-container *ngIf="episode.episodeNumber">פרק {{ episode.episodeNumber }} · </ng-container>
              {{ formatDate(episode.publishedAt) }}
            </small>
          </span>
        </button>

        <div class="tile-actions">
          <span class="badge" [class.inactive]="!episode.isActive">{{ getStatusLabel(episode.isActive) }}</span>
          <button type="button" class="icon-btn" (click)="editEpisode(episode)" title="עריכה">
            <span class="material-icons">edit</span>
          </button>
          <button type="button" class="icon-btn" (click)="duplicateEpisode(episode)" title="שכפול">
            <span class="material-icons">content_copy</span>
          </button>
          <button type="button" class="icon-btn danger" (click)="deleteEpisode(episode)" title="מחיקה">
            <span class="material-icons">delete</span>
          </button>
        </div>
      </article>

      <div *ngIf="selectedSeriesEpisodes.length === 0" class="state-box empty-series">אין עדיין פרקים בסדרה הזו</div>
    </div>
  </section>
</div>
