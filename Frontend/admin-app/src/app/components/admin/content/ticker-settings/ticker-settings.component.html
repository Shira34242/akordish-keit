<div class="ticker-admin" dir="rtl">
  <header class="ticker-header">
    <div>
      <h2>פס חדשות הירו</h2>
      <p class="subtitle">בנייה מחדש של הפס: מיקום, תנועה, טקסט ועיצוב במקום אחד</p>
    </div>

    <div class="header-actions">
      <span class="status-pill draft" *ngIf="dirty && !saving && !saveError">טיוטה</span>
      <span class="status-pill saved" *ngIf="saved">נשמר לכולם</span>
      <span class="status-pill error" *ngIf="saveError">לא נשמר</span>

      <button class="btn-primary" type="button" [disabled]="saving" (click)="saveForEveryone()">
        <span class="material-symbols-outlined">save</span>
        {{ saving ? 'שומר...' : 'שמור לכולם' }}
      </button>

      <button class="btn-secondary" type="button" (click)="resetDraft()">
        <span class="material-symbols-outlined">restart_alt</span>
        ברירת מחדל
      </button>
    </div>
  </header>

  <div class="ticker-admin-grid">
    <section class="preview-panel">
      <div class="panel-head">
        <h3>תצוגה חיה</h3>
        <div class="device-switch">
          <button type="button" [class.active]="previewMode === 'desktop'" (click)="setPreviewMode('desktop')">
            <span class="material-symbols-outlined">desktop_windows</span>
            מחשב
          </button>
          <button type="button" [class.active]="previewMode === 'mobile'" (click)="setPreviewMode('mobile')">
            <span class="material-symbols-outlined">smartphone</span>
            מובייל
          </button>
        </div>
      </div>

      <div class="screen-wrap" [class]="screenClass">
        <div class="preview-viewport">
          <iframe
            class="preview-frame"
            [src]="previewFrameSrc"
            title="תצוגה אמיתית של דף הבית">
          </iframe>
        </div>
      </div>
    </section>

    <section class="controls-panel">
      <div class="control-card">
        <h3>הפעלה ותוכן</h3>

        <div class="toggle-row">
          <div>
            <strong>הצגת הפס</strong>
            <span>{{ cfg.enabled ? 'מוצג בדף הבית' : 'מוסתר מדף הבית' }}</span>
          </div>
          <button class="toggle-btn" type="button" [class.on]="cfg.enabled" (click)="toggleEnabled()">
            <span></span>
          </button>
        </div>

        <div class="filter-grid">
          <button
            *ngFor="let option of filterOptions"
            type="button"
            class="chip"
            [class.active]="selectedFilter === option"
            (click)="selectFilter(option)">
            {{ option.label }}
          </button>
        </div>
      </div>

      <div class="control-card">
        <h3>מיקום וגודל</h3>

        <label class="range-control">
          <span>גובה על המסך</span>
          <b>{{ cfg.positionY }}%</b>
          <input type="range" min="-20" max="120" step="1" [(ngModel)]="cfg.positionY" (input)="markDraft()">
        </label>

        <label class="range-control">
          <span>מרכז אופקי</span>
          <b>{{ cfg.positionX }}%</b>
          <input type="range" min="-20" max="120" step="1" [(ngModel)]="cfg.positionX" (input)="markDraft()">
        </label>

        <label class="range-control">
          <span>רוחב הפס</span>
          <b>{{ cfg.widthVw }}%</b>
          <input type="range" min="80" max="260" step="1" [(ngModel)]="cfg.widthVw" (input)="markDraft()">
        </label>

        <label class="range-control">
          <span>זווית</span>
          <b>{{ cfg.rotation }}°</b>
          <input type="range" min="-45" max="45" step="0.5" [(ngModel)]="cfg.rotation" (input)="markDraft()">
        </label>
      </div>

      <div class="control-card">
        <h3>תנועה וטקסט</h3>

        <div class="segmented">
          <button
            *ngFor="let option of directionOptions"
            type="button"
            [class.active]="cfg.direction === option.value"
            (click)="setDirection(option.value)">
            {{ option.label }}
          </button>
        </div>

        <label class="range-control">
          <span>מהירות</span>
          <b>{{ cfg.speed }}s</b>
          <input type="range" min="12" max="80" step="1" [(ngModel)]="cfg.speed" (input)="markDraft()">
        </label>

        <label class="range-control">
          <span>גובה סרט</span>
          <b>{{ cfg.bandHeight }}px</b>
          <input type="range" min="16" max="90" step="1" [(ngModel)]="cfg.bandHeight" (input)="markDraft()">
        </label>

        <label class="range-control">
          <span>גודל טקסט</span>
          <b>{{ cfg.fontSize }}px</b>
          <input type="range" min="10" max="32" step="1" [(ngModel)]="cfg.fontSize" (input)="markDraft()">
        </label>

        <div class="segmented">
          <button
            *ngFor="let option of fontWeights"
            type="button"
            [class.active]="cfg.fontWeight === option.value"
            (click)="setFontWeight(option.value)">
            {{ option.label }}
          </button>
        </div>
      </div>

      <div class="control-card">
        <h3>צבעים</h3>

        <div class="color-grid">
          <label>
            <span>רקע</span>
            <input type="color" [(ngModel)]="cfg.backgroundColor" (input)="markDraft()">
          </label>
          <label>
            <span>טקסט</span>
            <input type="color" [(ngModel)]="cfg.textColor" (input)="markDraft()">
          </label>
          <label>
            <span>מפריד</span>
            <input type="color" [(ngModel)]="cfg.separatorColor" (input)="markDraft()">
          </label>
        </div>
      </div>

      <p class="info-note">
        השינויים כאן הם טיוטה בלבד. רק "שמור לכולם" מעדכן את דף הבית לכל הגולשים.
      </p>
    </section>
  </div>
</div>
