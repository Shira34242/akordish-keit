<div class="artists-page">

  <!-- Page Header -->
  <header class="page-header">
    <span class="section-label">אמנים</span>
    <h1 class="page-title">האמנים שלנו</h1>
    <p class="page-subtitle">{{ totalCount }} אמנים באתר</p>
  </header>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <div class="search-wrapper">
      <span class="material-icons search-icon">search</span>
      <input
        type="text"
        class="search-input"
        placeholder="חפש אמן..."
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchTermChange($event)">
    </div>
    <div class="sort-pills">
      <button class="sort-pill" [class.active]="sortBy === 'name'" (click)="setSortBy('name')">א–ת</button>
      <button class="sort-pill" [class.active]="sortBy === 'songcount'" (click)="setSortBy('songcount')">פופולרי</button>
      <button class="sort-pill" [class.active]="sortBy === 'created'" (click)="setSortBy('created')">חדשים</button>
    </div>
  </div>

  <!-- Content -->
  <div class="artists-container">

    <!-- Loading -->
    <div class="loading-state" *ngIf="loadingAll">
      <div class="spinner"></div>
    </div>

    <!-- Grid -->
    <div class="artists-grid" *ngIf="!loadingAll && allArtists.length > 0">
      <div
        *ngFor="let artist of allArtists"
        class="artist-card"
        (click)="navigateToArtist(artist.id)">
        <div class="artist-photo">
          <img [src]="artist.imageUrl || 'assets/default-artist.png'" [alt]="artist.name" loading="lazy">
        </div>
        <div class="artist-info">
          <span class="artist-name">{{ artist.name }}</span>
          <span class="artist-songs">{{ artist.songCount }} שירים</span>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="!loadingAll && allArtists.length === 0">
      <span class="material-icons">person_search</span>
      <p>לא נמצאו אמנים</p>
      <span *ngIf="searchTerm">נסה מילת חיפוש אחרת</span>
    </div>

    <!-- Pagination -->
    <div class="pagination" *ngIf="totalPages > 1 && !loadingAll && !searchTerm">
      <button class="page-btn" (click)="previousPage()" [disabled]="currentPage === 1">הקודם</button>
      <span class="page-info">{{ currentPage }} / {{ totalPages }}</span>
      <button class="page-btn" (click)="nextPage()" [disabled]="currentPage === totalPages">הבא</button>
    </div>

  </div>
</div>
