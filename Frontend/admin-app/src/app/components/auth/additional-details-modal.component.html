<div class="modal-backdrop" [class.modal-backdrop--seamless]="seamlessEntry" (click)="onBackdropClick($event)">
  <div class="modal-container" [class.modal-container--seamless]="seamlessEntry" (click)="$event.stopPropagation()">

    <button class="close-btn" type="button" (click)="onClose()" aria-label="סגירה">×</button>

    <p class="preview-notice" *ngIf="previewMode">תצוגה מקדימה — השינויים לא יישמרו</p>

    <div class="progress-track" aria-hidden="true">
      <span class="progress-fill" [style.width.%]="progressPercent"></span>
    </div>

    <header class="modal-header" *ngIf="currentStep === 'instrument'">
      <h2>שאלון קצר להתאמת החוויה באתר</h2>
    </header>

    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

    <section class="step-panel" *ngIf="currentStep === 'instrument'">
      <h3>מנגן/ת על משהו?</h3>
      <p class="selection-hint">אפשר לבחור יותר מכלי אחד</p>

      <div class="instrument-grid">
        <div class="instrument-row">
          <button
            type="button"
            class="choice-tile"
            *ngFor="let instrument of instrumentOptions.slice(0, 3)"
            [class.selected]="isInstrumentSelected(instrument.id)"
            (click)="toggleInstrument(instrument.id)">
            {{ instrument.label }}
            <span class="choice-check" aria-hidden="true">✓</span>
          </button>
        </div>

        <div class="instrument-row">
          <button
            type="button"
            class="choice-tile"
            *ngFor="let instrument of instrumentOptions.slice(3)"
            [class.selected]="isInstrumentSelected(instrument.id)"
            (click)="toggleInstrument(instrument.id)">
            {{ instrument.label }}
            <span class="choice-check" aria-hidden="true">✓</span>
          </button>
          <button
            *ngIf="!otherInstrumentEditing"
            type="button"
            class="choice-tile"
            [class.selected]="otherInstrumentSelected"
            (click)="toggleOtherInstrument()">
            {{ otherInstrumentSelected ? otherInstrumentName : 'אחר' }}
            <span class="choice-check" aria-hidden="true">✓</span>
          </button>
          <div class="other-instrument-editor" *ngIf="otherInstrumentEditing">
            <input
              type="text"
              name="otherInstrumentName"
              [(ngModel)]="otherInstrumentName"
              maxlength="50"
              placeholder="איזה כלי?"
              aria-label="שם כלי נגינה אחר"
              autofocus
              (keydown.enter)="confirmOtherInstrument(); $event.preventDefault()"
              (keydown.escape)="cancelOtherInstrument()"
            />
            <button
              type="button"
              class="other-instrument-confirm"
              [disabled]="otherInstrumentName.trim().length < 2"
              (click)="confirmOtherInstrument()"
              aria-label="אישור כלי נגינה אחר">
              ✓
            </button>
          </div>
          <button
            type="button"
            class="choice-tile"
            [class.selected]="notPlaying"
            (click)="selectNotPlaying()">
            לא מנגן/ת
            <span class="choice-check" aria-hidden="true">✓</span>
          </button>
        </div>
      </div>

      <p class="level-prompt" *ngIf="canChooseLevel">מה רמת הנגינה שלך?</p>

      <div class="level-row" *ngIf="canChooseLevel" aria-label="רמת נגינה">
        <button type="button" class="level-pill" [class.selected]="selectedLevel === 1" (click)="selectLevel(1)">מתחיל/ה</button>
        <button type="button" class="level-pill" [class.selected]="selectedLevel === 2" (click)="selectLevel(2)">מתקדם/ת</button>
        <button type="button" class="level-pill" [class.selected]="selectedLevel === 3" (click)="selectLevel(3)">מקצועי/ת</button>
      </div>
    </section>

    <section class="step-panel profile-details-panel" *ngIf="currentStep === 'profileDetails'">
      <h3>עוד כמה פרטים להשלמת החוויה באתר</h3>

      <form class="onboarding-details-form" (ngSubmit)="saveProfileDetails()">
        <div class="details-fields-grid">
          <label>
            <span>טלפון</span>
            <input type="tel" name="onboardingPhone" [(ngModel)]="phone" placeholder="מספר טלפון" autocomplete="tel">
          </label>

          <label class="onboarding-city-field">
            <span>עיר</span>
            <input
              type="text"
              name="onboardingCity"
              [(ngModel)]="citySearch"
              (input)="onCityInput()"
              (focus)="showCityDropdown = true"
              (blur)="onCityBlur()"
              placeholder="חיפוש עיר"
              autocomplete="address-level2">

            <div class="onboarding-city-dropdown" *ngIf="showCityDropdown && filteredCities.length > 0">
              <button type="button" *ngFor="let city of filteredCities" (click)="selectCity(city)">
                {{ city.name }}
              </button>
            </div>
          </label>

          <label class="details-address-field">
            <span>כתובת</span>
            <input type="text" name="onboardingAddress" [(ngModel)]="address" placeholder="כתובת מגורים" autocomplete="street-address">
          </label>

          <fieldset class="birthday-fields">
            <legend>תאריך לידה</legend>
            <select name="birthMonth" [(ngModel)]="birthMonth" aria-label="חודש לידה">
              <option [ngValue]="null" disabled>חודש</option>
              <option *ngFor="let month of months" [ngValue]="month.value">{{ month.label }}</option>
            </select>
            <select name="birthYear" [(ngModel)]="birthYear" aria-label="שנת לידה">
              <option [ngValue]="null" disabled>שנה</option>
              <option *ngFor="let year of birthYears" [ngValue]="year">{{ year }}</option>
            </select>
          </fieldset>
        </div>

        <button type="submit" class="details-continue-btn" [disabled]="!canContinueProfileDetails">
          {{ loading ? 'שומר...' : 'המשך' }}
        </button>
      </form>
    </section>

    <section class="step-panel" *ngIf="currentStep === 'userType'">
      <h3>מה הכי מתאים לך?</h3>

      <div class="choice-grid user-type-grid">
        <button
          type="button"
          class="choice-tile"
          [class.selected]="selectedUserType === UserType.Regular"
          (click)="selectUserType(UserType.Regular)">
          משתמש רגיל
          <span class="choice-check" aria-hidden="true">✓</span>
        </button>
        <button
          type="button"
          class="choice-tile"
          [class.selected]="selectedUserType === UserType.Teacher"
          (click)="selectUserType(UserType.Teacher)">
          מורה לנגינה
          <span class="choice-check" aria-hidden="true">✓</span>
        </button>
        <button
          type="button"
          class="choice-tile"
          *ngFor="let category of serviceProviderCategories; trackBy: trackByCategory"
          [class.selected]="selectedServiceProviderCategoryId === category.id"
          (click)="selectUserType(UserType.ServiceProvider, category.id)">
          {{ category.name }}
          <span class="choice-check" aria-hidden="true">✓</span>
        </button>
        <button
          type="button"
          class="choice-tile"
          [class.selected]="isGeneralServiceSelected()"
          (click)="selectUserType(UserType.ServiceProvider)">
          אחר
          <span class="choice-check" aria-hidden="true">✓</span>
        </button>
      </div>

      <p class="category-state" *ngIf="categoriesLoading">טוען קטגוריות...</p>
      <p class="category-state" *ngIf="!categoriesLoading && categoriesError">{{ categoriesError }}</p>
    </section>

    <section class="step-panel public-page-panel" *ngIf="currentStep === 'publicPage'">
      <h3>{{ publicPageTitle }}</h3>
      <p>{{ publicPageText }}</p>

      <div class="public-page-actions">
        <button type="button" class="add-page-btn" (click)="onAddPublicPage()" [disabled]="loading">
          <span class="plus-mark">+</span>
          <span *ngIf="!loading">הוספת דף</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>
        <button type="button" class="continue-site-btn" (click)="onSkipPublicPage()" [disabled]="loading">להמשיך לאתר</button>
      </div>
    </section>

  </div>
</div>
