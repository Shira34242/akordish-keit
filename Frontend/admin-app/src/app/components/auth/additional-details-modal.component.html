<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-container" (click)="$event.stopPropagation()">

    <button class="close-btn" type="button" (click)="onClose()" aria-label="סגירה">×</button>

    <div class="progress-track" aria-hidden="true">
      <span class="progress-fill" [style.width.%]="progressPercent"></span>
    </div>

    <header class="modal-header" *ngIf="currentStep === 'name'">
      <h2>ברוכים הבאים לאקורדישקייט</h2>
      <p class="eyebrow">שאלון קצר להתאמת החוויה באתר</p>
    </header>

    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

    <section class="step-panel" *ngIf="currentStep === 'name'">
      <h3>מה השם שלך?</h3>
      <input
        class="name-input"
        type="text"
        name="profileName"
        [(ngModel)]="profileName"
        placeholder="השם שלך"
        autocomplete="name"
      />
    </section>

    <section class="step-panel" *ngIf="currentStep === 'instrument'">
      <h3>מנגן/ת על משהו?</h3>

      <div class="choice-grid instrument-grid">
        <button
          type="button"
          class="choice-tile"
          *ngFor="let instrument of instrumentOptions"
          [class.selected]="isInstrumentSelected(instrument.id)"
          (click)="toggleInstrument(instrument.id)">
          {{ instrument.label }}
        </button>
      </div>

      <div class="level-row" aria-label="רמת נגינה">
        <button type="button" class="level-pill" [class.selected]="selectedLevel === 1" (click)="selectedLevel = 1">מתחיל/ה</button>
        <button type="button" class="level-pill" [class.selected]="selectedLevel === 2" (click)="selectedLevel = 2">מתקדם/ת</button>
        <button type="button" class="level-pill" [class.selected]="selectedLevel === 3" (click)="selectedLevel = 3">מקצועי/ת</button>
      </div>
    </section>

    <section class="step-panel" *ngIf="currentStep === 'userType'">
      <h3>מה הכי מתאים לך?</h3>

      <div class="choice-grid user-type-grid">
        <button
          type="button"
          class="choice-tile"
          [class.selected]="selectedUserType === UserType.Regular"
          (click)="selectUserType(UserType.Regular)">
          משתמש רגיל
        </button>
        <button
          type="button"
          class="choice-tile"
          [class.selected]="selectedUserType === UserType.Teacher"
          (click)="selectUserType(UserType.Teacher)">
          מורה לנגינה
        </button>
        <button
          type="button"
          class="choice-tile"
          [class.selected]="selectedUserType === UserType.Artist"
          (click)="selectUserType(UserType.Artist)">
          אמן
        </button>
        <button
          type="button"
          class="choice-tile"
          *ngFor="let category of serviceProviderCategories; trackBy: trackByCategory"
          [class.selected]="selectedServiceProviderCategoryId === category.id"
          (click)="selectUserType(UserType.ServiceProvider, category.id)">
          {{ category.name }}
        </button>
        <button
          type="button"
          class="choice-tile"
          [class.selected]="isGeneralServiceSelected()"
          (click)="selectUserType(UserType.ServiceProvider)">
          אחר
        </button>
      </div>

      <p class="category-state" *ngIf="categoriesLoading">טוען קטגוריות...</p>
      <p class="category-state" *ngIf="!categoriesLoading && categoriesError">{{ categoriesError }}</p>
    </section>

    <section class="step-panel public-page-panel" *ngIf="currentStep === 'publicPage'">
      <h3>{{ publicPageTitle }}</h3>
      <p>{{ publicPageText }}</p>

      <div class="public-page-actions">
        <button type="button" class="add-page-btn" (click)="onAddPublicPage()" [disabled]="loading">
          <span class="plus-mark">+</span>
          <span *ngIf="!loading">הוספת דף</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>
        <button type="button" class="continue-site-btn" (click)="onSkipPublicPage()" [disabled]="loading">להמשיך לאתר</button>
      </div>
    </section>

    <footer class="step-actions" *ngIf="currentStep !== 'publicPage'">
      <button type="button" class="skip-link" (click)="skipStep()">דלג</button>
      <button type="button" class="arrow-btn" (click)="goNext()" [disabled]="loading" aria-label="המשך">
        <svg *ngIf="!loading" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </footer>

  </div>
</div>
