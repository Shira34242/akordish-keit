<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-container" (click)="$event.stopPropagation()">

    <!-- Close Button -->
    <button class="close-btn" (click)="onClose()">✕</button>

    <!-- Modal Header -->
    <div class="modal-header">
      <h2>{{ isLogin ? ':כניסה' : ':הרשמה' }}</h2>
    </div>

    <!-- Error Message -->
    <div class="error-message" *ngIf="errorMessage">
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Form -->
    <form class="auth-form" (ngSubmit)="onSubmit()">

      <!-- שם משתמש - הרשמה בלבד -->
      <div class="form-group" *ngIf="!isLogin">
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          placeholder="שם משתמש"
          required
          [disabled]="loading"
        />
      </div>

      <!-- מייל - הרשמה: email field | כניסה: username field (שרת מצפה ל-username) -->
      <div class="form-group" *ngIf="!isLogin">
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="מייל"
          required
          [disabled]="loading"
        />
      </div>
      <div class="form-group" *ngIf="isLogin">
        <input
          type="text"
          id="loginEmail"
          [(ngModel)]="username"
          name="loginEmail"
          placeholder="מייל"
          required
          [disabled]="loading"
        />
      </div>

      <!-- Password -->
      <div class="form-group">
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="password"
          [(ngModel)]="password"
          (ngModelChange)="onPasswordChange()"
          name="password"
          placeholder="סיסמה"
          required
          [disabled]="loading"
        />
      </div>
      <p class="password-hint" *ngIf="!isLogin">8+ תווים, אות גדולה, ספרה ותו מיוחד (@$!%*?&amp;#)</p>

      <!-- Google Sign-In Button -->
      <div class="google-btn-wrapper">
        <asl-google-signin-button
          type="standard"
          size="large"
          text="signin_with">
        </asl-google-signin-button>
      </div>

      <!-- Terms (הרשמה בלבד) -->
      <div class="terms-row" *ngIf="!isLogin">
        <input type="checkbox" class="terms-checkbox" checked readonly />
        <span class="terms-text">
          בהרשמה לאתר אני מאשר/ת את <a href="#">תקנון האתר</a> ומסכים/ה לקבל עדכונים ותוכן שיווקי במייל.
        </span>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit" [disabled]="loading">
        <span *ngIf="!loading">{{ isLogin ? 'היכנס <' : 'המשך <' }}</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <!-- Toggle Mode -->
    <div class="toggle-mode">
      <span *ngIf="isLogin">
        עדיין אין לך חשבון? <a (click)="toggleMode()">הירשם</a>
      </span>
      <span *ngIf="!isLogin">
        כבר יש לך חשבון? <a (click)="toggleMode()">היכנס</a>
      </span>
    </div>

  </div>
</div>
