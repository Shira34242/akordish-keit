<div class="soft-reminder-backdrop" (click)="onBackdropClick($event)">
  <section class="soft-reminder-modal" dir="rtl" role="dialog" aria-modal="true">
    <button type="button" class="soft-reminder-close" (click)="onDismiss()" aria-label="סגירה">
      <span class="material-icons">close</span>
    </button>

    <div class="soft-reminder-header">
      <h2>{{ title }}</h2>
      <p>אפשר להשלים עכשיו, ואפשר גם לדחות לפעם אחרת.</p>
    </div>

    <form class="soft-reminder-form" (ngSubmit)="onSave()">
      <label>
        <span>טלפון</span>
        <input type="tel" name="phone" [(ngModel)]="phone" placeholder="מספר טלפון">
      </label>

      <label class="city-field">
        <span>עיר</span>
        <input
          type="text"
          name="city"
          [(ngModel)]="citySearch"
          (input)="onCityInput()"
          (focus)="showCityDropdown = true"
          (blur)="onCityBlur()"
          placeholder="חיפוש עיר">

        <div class="city-dropdown" *ngIf="showCityDropdown && filteredCities.length > 0">
          <button
            type="button"
            *ngFor="let city of filteredCities"
            (click)="selectCity(city)">
            {{ city.name }}
          </button>
        </div>
      </label>

      <label>
        <span>כתובת</span>
        <input type="text" name="address" [(ngModel)]="address" placeholder="כתובת מגורים">
      </label>

      <div class="birthday-row">
        <label>
          <span>חודש לידה</span>
          <div class="month-select">
            <button
              type="button"
              class="month-select-trigger"
              [attr.aria-expanded]="showMonthDropdown"
              aria-haspopup="listbox"
              (click)="toggleMonthDropdown()">
              {{ selectedMonthLabel }}
              <span class="material-icons" aria-hidden="true">expand_more</span>
            </button>
            <div class="month-select-options" *ngIf="showMonthDropdown" role="listbox" aria-label="בחירת חודש לידה">
              <button
                *ngFor="let month of months"
                type="button"
                role="option"
                [attr.aria-selected]="birthMonth === month.value"
                [class.is-selected]="birthMonth === month.value"
                (click)="selectBirthMonth(month.value)">
                {{ month.label }}
              </button>
            </div>
          </div>
        </label>

        <label>
          <span>שנת לידה</span>
          <input
            type="number"
            name="birthYear"
            [(ngModel)]="birthYear"
            [min]="minBirthYear"
            [max]="maxBirthYear"
            step="1"
            inputmode="numeric"
            autocomplete="bday-year"
            placeholder="בחירת שנה"
            aria-label="שנת לידה">
        </label>
      </div>

      <p class="soft-reminder-error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <div class="soft-reminder-actions">
        <button type="button" class="btn-secondary" (click)="onDismiss()">לא עכשיו</button>
        <button type="submit" class="btn-primary" [disabled]="!canSave">
          {{ loading ? 'שומר...' : 'שמירה' }}
        </button>
      </div>
    </form>
  </section>
</div>
