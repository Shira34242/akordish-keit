<div class="soft-reminder-backdrop" (click)="onBackdropClick($event)">
  <section class="soft-reminder-modal" dir="rtl" role="dialog" aria-modal="true">
    <button type="button" class="soft-reminder-close" (click)="onDismiss()" aria-label="סגירה">
      <span class="material-icons">close</span>
    </button>

    <div class="soft-reminder-header">
      <h2>{{ title }}</h2>
      <p>אפשר להשלים עכשיו, ואפשר גם לדחות לפעם אחרת.</p>
    </div>

    <form class="soft-reminder-form" (ngSubmit)="onSave()">
      <label>
        <span>טלפון</span>
        <input type="tel" name="phone" [(ngModel)]="phone" placeholder="מספר טלפון">
      </label>

      <label class="city-field">
        <span>עיר</span>
        <input
          type="text"
          name="city"
          [(ngModel)]="citySearch"
          (input)="onCityInput()"
          (focus)="showCityDropdown = true"
          (blur)="onCityBlur()"
          placeholder="חיפוש עיר">

        <div class="city-dropdown" *ngIf="showCityDropdown && filteredCities.length > 0">
          <button
            type="button"
            *ngFor="let city of filteredCities"
            (click)="selectCity(city)">
            {{ city.name }}
          </button>
        </div>
      </label>

      <label>
        <span>כתובת</span>
        <input type="text" name="address" [(ngModel)]="address" placeholder="כתובת מגורים">
      </label>

      <div class="birthday-row">
        <label>
          <span>חודש לידה</span>
          <select name="birthMonth" [(ngModel)]="birthMonth">
            <option [ngValue]="null">בחירת חודש</option>
            <option *ngFor="let month of months" [ngValue]="month.value">{{ month.label }}</option>
          </select>
        </label>

        <label>
          <span>שנת לידה</span>
          <select name="birthYear" [(ngModel)]="birthYear">
            <option [ngValue]="null">בחירת שנה</option>
            <option *ngFor="let year of years" [ngValue]="year">{{ year }}</option>
          </select>
        </label>
      </div>

      <p class="soft-reminder-error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <div class="soft-reminder-actions">
        <button type="button" class="btn-secondary" (click)="onDismiss()">לא עכשיו</button>
        <button type="submit" class="btn-primary" [disabled]="!canSave">
          {{ loading ? 'שומר...' : 'שמירה' }}
        </button>
      </div>
    </form>
  </section>
</div>
