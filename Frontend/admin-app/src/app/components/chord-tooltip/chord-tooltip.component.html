<div class="tooltip-container" (click)="$event.stopPropagation()">
    <button
        class="known-chord-btn"
        [class.known]="isKnownChord"
        [disabled]="isSavingKnownChord"
        (click)="toggleKnownChord($event)"
        (mouseenter)="playBtnHoverChange.emit(true)"
        (mouseleave)="playBtnHoverChange.emit(false)"
        [title]="isKnownChord ? 'האקורד ברשימת האקורדים שאני יודע לנגן' : 'להוספה לרשימת האקורדים שאני יודע לנגן'"
        [attr.aria-label]="isKnownChord ? 'האקורד ברשימת האקורדים שאני יודע לנגן' : 'להוספה לרשימת האקורדים שאני יודע לנגן'">
        {{ isKnownChord ? '✓' : '+' }}
    </button>
    <button *ngIf="isPinned" class="tooltip-close-btn" (click)="closePinned.emit()" aria-label="סגור">×</button>
    <div class="chord-name">
        {{ chordName }}
        <span class="simplified-note" *ngIf="displayChordName && displayChordName !== chordName">
            (מוצג כ-{{ displayChordName }})
        </span>
    </div>

    <!-- Guitar Diagram -->
    <div *ngIf="guitarChord" class="diagram guitar">
        <svg viewBox="0 0 80 80" width="110" height="120">
            <!-- Nut (Top Line) -->
            <line x1="10" y1="10" x2="60" y2="10" stroke="black" stroke-width="2" />

            <!-- Frets -->
            <line *ngFor="let i of [1,2,3,4,5]" [attr.x1]="10" [attr.y1]="10 + i*12" [attr.x2]="60"
                [attr.y2]="10 + i*12" stroke="#999" stroke-width="1" />

            <!-- Strings -->
            <line *ngFor="let i of [0,1,2,3,4,5]" [attr.x1]="10 + i*10" y1="10" [attr.x2]="10 + i*10" y2="70"
                stroke="black" stroke-width="1" />

            <!-- Mute/Open Indicators & Finger Positions -->
            <ng-container *ngFor="let fret of guitarChord.frets; let i = index">
                <!-- Mute (x) -->
                <text *ngIf="fret === -1" [attr.x]="10 + i*10" y="6" text-anchor="middle" font-size="8"
                    font-family="Arial">x</text>

                <!-- Open (o) — filled yellow if this string is the bass note -->
                <circle *ngIf="fret === 0" [attr.cx]="10 + i*10" cy="5" r="2"
                    [attr.fill]="getBassStringIndex() === i ? '#ddff53' : 'none'"
                    stroke="black" stroke-width="1" />

                <!-- Finger (filled circle) — yellow if this string is the bass note -->
                <circle *ngIf="fret > 0" [attr.cx]="10 + i*10" [attr.cy]="10 + fret*12 - 6" r="3.5"
                    [attr.fill]="getBassStringIndex() === i ? '#ddff53' : '#1a1a1a'" />
            </ng-container>

            <!-- Barres -->
            <ng-container *ngIf="guitarChord.barres">
                <rect *ngFor="let barre of guitarChord.barres" [attr.x]="getBarreX(barre)"
                    [attr.y]="10 + barre.fret*12 - 9" [attr.width]="getBarreWidth(barre)" height="6" rx="3"
                    fill="#1a1a1a" opacity="0.2" />
            </ng-container>

            <!-- Fret position label (e.g. "3fr") — shown when chord is not at nut -->
            <text *ngIf="getMinActiveFret() > 1"
                x="65" [attr.y]="getFretY(getMinActiveFret()) - 2"
                text-anchor="start" font-size="7" font-family="Arial" fill="#555">
                {{ getMinActiveFret() }}fr
            </text>
        </svg>

        <!-- Bass note label — centered below diagram -->
        <div *ngIf="parsedBass" class="bass-note-label">בס: {{ parsedBass }}</div>
    </div>

    <!-- Piano Diagram (compact display) -->
    <div *ngIf="pianoKeys" class="diagram piano">
        <svg [attr.viewBox]="'0 0 ' + pianoDisplayWidth + ' 60'" [attr.width]="pianoDisplayWidth" height="60">
            <!-- White Keys -->
            <ng-container *ngFor="let key of pianoWhiteKeys; let i = index">
                <rect [attr.x]="i * 20" y="0" width="20" height="60"
                    stroke="black" stroke-width="1"
                    [attr.fill]="getPianoKeyFill(key.note, false)" />
                <!-- Bass note indicator: small dot at bottom of white key -->
                <circle *ngIf="bassAbsoluteNote !== null && key.note === bassAbsoluteNote"
                    [attr.cx]="i * 20 + 10" cy="53" r="3" fill="#000" />
            </ng-container>

            <!-- Black Keys -->
            <ng-container *ngFor="let key of pianoBlackKeys">
                <rect [attr.x]="key.x" y="0" width="12" height="35"
                    [attr.fill]="getPianoKeyFill(key.note, true)" />
                <!-- Bass note indicator: small dot inside black key -->
                <circle *ngIf="bassAbsoluteNote !== null && key.note === bassAbsoluteNote"
                    [attr.cx]="key.x + 6" cy="29" r="2.5" fill="white" />
            </ng-container>
        </svg>

        <!-- Bass note label — centered below diagram -->
        <div *ngIf="parsedBass" class="bass-note-label">בס: {{ parsedBass }}</div>
    </div>

    <!-- Ukulele Diagram (4 strings: G C E A) -->
    <div *ngIf="ukuleleChord" class="diagram ukulele">
        <svg viewBox="0 0 56 80" width="90" height="120">
            <!-- Nut -->
            <line x1="10" y1="10" x2="52" y2="10" stroke="black" stroke-width="2" />

            <!-- Frets -->
            <line *ngFor="let i of [1,2,3,4,5]"
                [attr.x1]="10" [attr.y1]="10 + i*12"
                [attr.x2]="52" [attr.y2]="10 + i*12"
                stroke="#999" stroke-width="1" />

            <!-- Strings (4) -->
            <line *ngFor="let i of [0,1,2,3]"
                [attr.x1]="getUkuStringX(i)" y1="10"
                [attr.x2]="getUkuStringX(i)" y2="70"
                stroke="black" stroke-width="1" />

            <!-- Tuning labels G C E A -->
            <text *ngFor="let label of ['G','C','E','A']; let i = index"
                [attr.x]="getUkuStringX(i)" y="78"
                text-anchor="middle" font-size="6" font-family="Arial" fill="#555">{{ label }}</text>

            <!-- Mute/Open/Finger per string -->
            <ng-container *ngFor="let fret of ukuleleChord.frets; let i = index">
                <text *ngIf="fret === -1"
                    [attr.x]="getUkuStringX(i)" y="6"
                    text-anchor="middle" font-size="8" font-family="Arial">x</text>

                <circle *ngIf="fret === 0"
                    [attr.cx]="getUkuStringX(i)" cy="5" r="2"
                    fill="none" stroke="black" stroke-width="1" />

                <circle *ngIf="fret > 0"
                    [attr.cx]="getUkuStringX(i)" [attr.cy]="getUkuFretY(fret) - 6" r="3.5"
                    fill="#1a1a1a" />
            </ng-container>

            <!-- Barres -->
            <ng-container *ngIf="ukuleleChord.barres">
                <rect *ngFor="let barre of ukuleleChord.barres"
                    [attr.x]="getUkuBarreX(barre)"
                    [attr.y]="getUkuFretY(barre.fret) - 9"
                    [attr.width]="getUkuBarreWidth(barre)" height="6" rx="3"
                    fill="#1a1a1a" opacity="0.2" />
            </ng-container>

            <!-- Fret position label -->
            <text *ngIf="getUkuMinActiveFret() > 1"
                x="56" [attr.y]="getUkuFretY(getUkuMinActiveFret()) - 2"
                text-anchor="start" font-size="7" font-family="Arial" fill="#555">
                {{ getUkuMinActiveFret() }}fr
            </text>
        </svg>
    </div>

    <div *ngIf="!guitarChord && !pianoKeys && !ukuleleChord" class="no-data">
        אין תרשים זמין עבור {{ chordName }}
    </div>

    <!-- כפתור ניגון — מוצג תמיד כשיש תרשים -->
    <button
        *ngIf="guitarChord || pianoKeys || ukuleleChord"
        class="play-chord-btn"
        [class.playing]="isPlaying"
        (click)="playChord($event)"
        (mouseenter)="playBtnHoverChange.emit(true)"
        (mouseleave)="playBtnHoverChange.emit(false)"
        title="נגן אקורד">
        <!-- אייקון רמקול -->
        <svg *ngIf="!isPlaying" viewBox="0 0 24 24" width="13" height="13" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="m15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <!-- אייקון עצירה -->
        <svg *ngIf="isPlaying" viewBox="0 0 24 24" width="11" height="11" fill="currentColor">
            <rect x="4" y="4" width="5" height="16"/><rect x="15" y="4" width="5" height="16"/>
        </svg>
        <span class="play-chord-label">{{ isPlaying ? 'מנגן...' : 'להשמעת האקורד' }}</span>
    </button>
</div>
