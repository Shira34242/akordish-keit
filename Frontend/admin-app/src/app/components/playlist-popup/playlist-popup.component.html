<div class="popup-backdrop" (click)="onBackdropClick($event)">
  <div class="popup-card" (click)="$event.stopPropagation()">
    <div class="popup-header">
      <button class="icon-bookmark-filled" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
        </svg>
      </button>
      <h3>ניהול שמירה</h3>
    </div>

    <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="error-message" *ngIf="error">{{ error }}</div>

    <div class="loading-state" *ngIf="isLoading">
      <div class="spinner"></div>
      <p>טוען רשימות...</p>
    </div>

    <ng-container *ngIf="!isLoading">
      <div class="status-panel" *ngIf="songState.isInDefault">
        <div class="status-copy">
          <strong>השיר שמור ב"השמורים שלי"</strong>
          <p>אפשר להוסיף אותו גם לרשימות האישיות שלך.</p>
        </div>
        <button class="btn-status-remove" type="button" (click)="startRemoveFromDefault()">
          הסר מהשמורים שלי
        </button>
      </div>

      <div class="remove-panel" *ngIf="showRemoveOptions">
        <label class="remove-checkbox">
          <input type="checkbox" [(ngModel)]="removeFromPersonalPlaylists">
          <span>להסיר גם מכל הרשימות האישיות</span>
        </label>
        <div class="remove-actions">
          <button class="btn-remove-confirm" type="button" (click)="removeFromDefault()" [disabled]="isRemovingFromDefault">
            {{ isRemovingFromDefault ? 'מסיר...' : 'אישור הסרה' }}
          </button>
          <button class="btn-cancel" type="button" (click)="cancelRemoveFromDefault()">ביטול</button>
        </div>
      </div>

      <div class="playlists-list" *ngIf="!isCreatingNew">
        <p class="section-label">רשימות השירים האישיות שלך</p>

        <label class="playlist-toggle" *ngFor="let playlist of personalPlaylists">
          <div class="playlist-meta">
            <span class="playlist-name">{{ playlist.name }}</span>
            <span class="playlist-count">{{ playlist.songCount }} שירים</span>
          </div>
          <input
            type="checkbox"
            [checked]="isSelected(playlist.id)"
            (change)="onPlaylistToggle(playlist.id, $event)">
        </label>

        <div class="empty-state" *ngIf="personalPlaylists.length === 0">
          <p>עדיין אין לך רשימות שירים אישיות.</p>
        </div>
      </div>

      <div class="create-new-form" *ngIf="isCreatingNew">
        <input
          type="text"
          class="new-playlist-input"
          [(ngModel)]="newPlaylistName"
          placeholder="שם הרשימה החדשה"
          (keyup.enter)="createNewPlaylist()"
          autofocus>

        <div class="privacy-toggle">
          <label class="toggle-label">
            <input type="checkbox" [(ngModel)]="newPlaylistIsPublic" class="toggle-checkbox">
            <span class="toggle-slider"></span>
            <span class="toggle-text">{{ newPlaylistIsPublic ? 'רשימה ציבורית' : 'רשימה פרטית' }}</span>
          </label>
        </div>

        <div class="form-actions">
          <button class="btn-create" type="button" (click)="createNewPlaylist()">צור רשימה</button>
          <button class="btn-cancel" type="button" (click)="toggleCreateNew()">ביטול</button>
        </div>
      </div>

      <div class="popup-actions" *ngIf="!isCreatingNew">
        <button class="action-btn btn-new-playlist" type="button" (click)="toggleCreateNew()">
          רשימה חדשה
        </button>

        <button class="action-btn btn-view-all" routerLink="/community-playlists" (click)="closePopup()">
          למאגר הקהילתי
        </button>

        <button class="action-btn btn-my-playlists" routerLink="/my-playlists" (click)="closePopup()">
          לרשימות שלי
        </button>
      </div>
    </ng-container>
  </div>
</div>
