<div class="popup-backdrop" (click)="onBackdropClick($event)">
  <div class="popup-card" (click)="$event.stopPropagation()">

    <div class="popup-header">
      <button class="icon-bookmark-filled" type="button" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
        </svg>
      </button>
      <h3>{{ 'popup.title' | translate }}</h3>
      <button class="btn-add" type="button" (click)="toggleCreateNew()" [title]="isCreatingNew ? ('shared.cancel' | translate) : ('popup.new_list' | translate)">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line *ngIf="!isCreatingNew" x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <div class="create-new-form" *ngIf="isCreatingNew">
      <input
        type="text"
        class="new-playlist-input"
        [(ngModel)]="newPlaylistName"
        [placeholder]="'popup.name_placeholder' | translate"
        (keyup.enter)="createNewPlaylist()"
        autofocus>
      <div class="privacy-toggle">
        <label class="toggle-label">
          <input type="checkbox" [(ngModel)]="newPlaylistIsPublic" class="toggle-checkbox">
          <span class="toggle-slider"></span>
          <span class="toggle-text">{{ newPlaylistIsPublic ? ('popup.public' | translate) : ('popup.private' | translate) }}</span>
        </label>
      </div>
      <div class="form-actions">
        <button class="btn-create" type="button" (click)="createNewPlaylist()">{{ 'popup.create' | translate }}</button>
        <button class="btn-cancel" type="button" (click)="toggleCreateNew()">{{ 'shared.cancel' | translate }}</button>
      </div>
    </div>

    <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="error-message" *ngIf="error">{{ error }}</div>

    <div class="loading-state" *ngIf="isLoading">
      <div class="spinner"></div>
    </div>

    <ng-container *ngIf="!isLoading && !isCreatingNew">
      <div class="playlists-list">

        <label class="playlist-toggle" (click)="onDefaultToggle()">
          <span class="circle-check" [class.circle-check--on]="songState.isInDefault">
            <svg *ngIf="songState.isInDefault" viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polyline points="1,5 4.5,8.5 11,1.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <div class="playlist-meta">
            <span class="playlist-name">{{ defaultPlaylist?.name || ('popup.default_playlist' | translate) }}</span>
            <span class="playlist-count">{{ defaultPlaylist?.songCount ?? 0 }} {{ 'popup.songs_suffix' | translate }}</span>
          </div>
        </label>

        <label class="playlist-toggle" *ngFor="let playlist of personalPlaylists">
          <span class="circle-check" [class.circle-check--on]="isSelected(playlist.id)">
            <svg *ngIf="isSelected(playlist.id)" viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polyline points="1,5 4.5,8.5 11,1.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <div class="playlist-meta">
            <span class="playlist-name">{{ playlist.name }}</span>
            <span class="playlist-count">{{ playlist.songCount }} {{ 'popup.songs_suffix' | translate }}</span>
          </div>
          <input
            type="checkbox"
            class="hidden-checkbox"
            [checked]="isSelected(playlist.id)"
            (change)="onPlaylistToggle(playlist.id, $event)">
        </label>

      </div>

      <div class="popup-footer">
        <div class="footer-links">
          <a class="link-archive" routerLink="/community-playlists" (click)="closePopup()">{{ 'popup.community' | translate }}</a>
          <span class="footer-sep">·</span>
          <a class="link-archive" routerLink="/my-playlists" (click)="closePopup()">{{ 'popup.my_playlists' | translate }}</a>
        </div>
        <button class="btn-done" type="button" (click)="closePopup()">{{ 'popup.done' | translate }}</button>
      </div>
    </ng-container>

  </div>
</div>
