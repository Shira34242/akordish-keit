<div class="articles-page" dir="rtl">

  <!-- Loading -->
  <div *ngIf="isLoading" class="loading-container">
    <div class="loading-spinner"></div>
  </div>

  <div *ngIf="!isLoading" class="page-content">

    <!-- Page Header -->
    <div class="page-header">
      <h1 class="page-title">{{ categoryName || 'כל הכתבות' }}</h1>
    </div>

    <!-- Filter Bar -->
    <section class="filter-bar">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="חיפוש..."
        class="filter-input"
        (keyup.enter)="applyFilters()"
      >
      <select [(ngModel)]="categoryId" class="filter-select">
        <option [value]="undefined">כל הקטגוריות</option>
        <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
      </select>
      <select [(ngModel)]="contentType" class="filter-select">
        <option [value]="undefined">כל הסוגים</option>
        <option *ngFor="let type of contentTypes" [value]="type.id">{{ type.name }}</option>
      </select>
      <div class="filter-actions">
        <button class="btn-search" (click)="applyFilters()">חיפוש</button>
        <button class="btn-reset" (click)="resetFilters()">איפוס</button>
      </div>
    </section>

    <!-- Results count -->
    <div class="results-count" *ngIf="totalCount > 0">
      {{ totalCount }} כתבות
    </div>

    <!-- Articles Grid -->
    <section class="articles-grid" *ngIf="articles.length > 0">
      <app-news-banner
        *ngFor="let article of articles"
        [article]="article">
      </app-news-banner>
    </section>

    <!-- No Results -->
    <div *ngIf="articles.length === 0" class="no-results">
      <p>לא נמצאו כתבות</p>
    </div>

    <!-- Pagination -->
    <div class="pagination" *ngIf="totalPages > 1">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">›</button>
      <button
        *ngFor="let page of pageNumbers"
        class="btn-page"
        [class.active]="page === currentPage"
        (click)="goToPage(page)">
        {{ page }}
      </button>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">‹</button>
    </div>

  </div>
</div>
