<div class="articles-page">

  <!-- Loading -->
  <div *ngIf="isLoading" class="page-loading">
    <div class="spinner"></div>
  </div>

  <div *ngIf="!isLoading" class="news-content">

    <!-- Page Header -->
    <div class="page-header">
      <h1 class="page-title">
        <ng-container *ngIf="tagId; else titleNoTag">תגית: {{ tagName || '#' + tagId }}</ng-container>
        <ng-template #titleNoTag>{{ categoryName || ('articles.all_title' | translate) }}</ng-template>
      </h1>
      <a *ngIf="tagId" class="tag-filter-clear" [routerLink]="['/articles']" title="הסר סינון תגית">
        × הסר סינון תגית
      </a>
    </div>

    <!-- Filter Bar -->
    <section class="filter-bar">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        [placeholder]="'articles.search_placeholder' | translate"
        class="filter-input"
        (keyup.enter)="applyFilters()"
      >
      <select [(ngModel)]="categoryId" class="filter-select">
        <option [value]="undefined">{{ 'articles.all_categories' | translate }}</option>
        <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.key | translate }}</option>
      </select>
      <select [(ngModel)]="contentType" class="filter-select">
        <option [value]="undefined">{{ 'articles.all_types' | translate }}</option>
        <option *ngFor="let type of contentTypes" [value]="type.id">{{ type.key | translate }}</option>
      </select>
      <div class="filter-actions">
        <button class="btn-search" (click)="applyFilters()">{{ 'shared.search' | translate }}</button>
        <button class="btn-reset" (click)="resetFilters()">{{ 'shared.reset' | translate }}</button>
      </div>
    </section>

    <!-- Results count -->
    <div class="results-count" *ngIf="totalCount > 0">
      {{ totalCount }} {{ 'articles.count_suffix' | translate }}
    </div>

    <!-- Articles Grid -->
    <section class="articles-grid" *ngIf="articles.length > 0">
      <div
        class="article-cell"
        *ngFor="let article of articles; let i = index"
        [ngClass]="getCellClass(i)">
        <app-news-banner [article]="article"></app-news-banner>
      </div>
    </section>

    <!-- No Results -->
    <div *ngIf="articles.length === 0" class="no-results">
      <p>{{ 'articles.no_results' | translate }}</p>
    </div>

    <!-- Pagination -->
    <div class="pagination" *ngIf="totalPages > 1">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">›</button>
      <button
        *ngFor="let page of pageNumbers"
        class="btn-page"
        [class.active]="page === currentPage"
        (click)="goToPage(page)">
        {{ page }}
      </button>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">‹</button>
    </div>

  </div>
</div>
