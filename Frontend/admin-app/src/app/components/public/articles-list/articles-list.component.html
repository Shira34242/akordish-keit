<div class="articles-page">

  <div *ngIf="isLoading" class="page-loading">
    <div class="spinner"></div>
  </div>

  <div *ngIf="!isLoading && isUniversalSearch" class="search-content">
    <div class="search-results-header">
      <h1>תוצאות חיפוש</h1>
      <p>“{{ searchTerm }}”</p>
    </div>

    <div class="search-results-groups" *ngIf="hasUniversalResults">
      <section class="search-results-group" *ngFor="let group of searchGroups">
        <h2>{{ group.label }}</h2>
        <div class="search-results-grid">
          <button
            type="button"
            class="search-result-card"
            *ngFor="let item of group.items; trackBy: trackBySearchItem"
            (click)="navigateToSearchItem(item)">
            <img [src]="getSearchItemImage(item)" [alt]="item.title" loading="lazy" decoding="async">
            <span class="search-result-text">
              <strong>{{ item.title }}</strong>
              <small *ngIf="item.subtitle">{{ item.subtitle }}</small>
            </span>
            <span class="material-icons" aria-hidden="true">arrow_back</span>
          </button>
        </div>
      </section>
    </div>

    <div *ngIf="!hasUniversalResults" class="no-results">
      <p>לא נמצאו תוצאות</p>
    </div>
  </div>

  <div *ngIf="!isLoading && !isUniversalSearch" class="news-content">
    <div class="managed-grid" *ngIf="sortedArticles.length > 0">
      <div
        class="managed-row"
        *ngFor="let row of getManagedRows(); trackBy: trackByIndex"
        [ngStyle]="{'grid-template-columns': row.gridCols}">
        <div class="managed-cell" *ngFor="let slot of row.slots; trackBy: trackByIndex">
          <app-news-banner
            *ngIf="getManagedArticle(slot)"
            [article]="getManagedArticle(slot)!"
            [imageLoading]="slot === 0 ? 'eager' : 'lazy'"
            [imageFetchPriority]="slot === 0 ? 'high' : 'auto'">
          </app-news-banner>
          <div *ngIf="!getManagedArticle(slot)" class="cell-skeleton"></div>
        </div>
      </div>
    </div>

    <div class="stream-grid">
      <div
        class="stream-row"
        *ngFor="let row of getStreamRows(); trackBy: trackByIndex"
        [ngStyle]="{'grid-template-columns': row.gridCols}">
        <div
          class="stream-cell"
          *ngFor="let article of row.articles; trackBy: trackById">
          <app-news-banner [article]="article"></app-news-banner>
        </div>
      </div>
    </div>

    <div *ngIf="sortedArticles.length === 0" class="no-results">
      <p>{{ 'articles.no_results' | translate }}</p>
    </div>

    <div class="pagination" *ngIf="totalPages > 1">
      <button class="btn-page" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">&lsaquo;</button>
      <button
        *ngFor="let page of pageNumbers"
        class="btn-page"
        [class.active]="page === currentPage"
        (click)="goToPage(page)">
        {{ page }}
      </button>
      <button class="btn-page" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">&rsaquo;</button>
    </div>

  </div>
</div>
