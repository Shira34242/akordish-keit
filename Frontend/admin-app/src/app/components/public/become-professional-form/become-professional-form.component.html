<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-container" dir="rtl">
    <button class="close-button" type="button" (click)="onClose()" aria-label="סגירה">
      <span class="material-icons">close</span>
    </button>

    <div class="form-header">
      <div class="progress-bar" aria-label="התקדמות">
        <div class="progress-step" [class.active]="currentStep >= 1" [class.completed]="currentStep > 1"><span>1</span></div>
        <div class="progress-line" [class.completed]="currentStep > 1"></div>
        <div class="progress-step" [class.active]="currentStep >= 2"><span>2</span></div>
      </div>
    </div>

    <div class="form-content">
      <div class="form-step" *ngIf="currentStep === 1">
        <div class="profile-top">
          <button class="profile-upload" type="button" (click)="profileInput.click()" [class.has-image]="profileImageUrl">
            <img *ngIf="profileImageUrl" [src]="profileImageUrl" alt="">
            <span class="material-icons">{{ profileImageUploading ? 'hourglass_top' : 'add_photo_alternate' }}</span>
            <strong>{{ profileImageUploading ? 'מעלה תמונה...' : 'העלאת תמונת פרופיל' }}</strong>
          </button>
          <button
            *ngIf="profileImageUrl && !profileImageUploading"
            type="button"
            class="profile-focus-edit"
            (click)="openProfileImageCropper()"
            aria-label="עריכת מיקוד תמונת פרופיל">
            <span class="material-icons">tune</span>
          </button>
          <input #profileInput type="file" accept="image/*,.heic,.heif,.jxl" hidden (change)="onProfileImageSelected($event)">
          <app-profile-image-cropper
            *ngIf="profileCropFile || profileCropUrl"
            [sourceFile]="profileCropFile"
            [sourceUrl]="profileCropUrl"
            [fileName]="profileCropFileName"
            (cropped)="uploadCroppedProfileImage($event)"
            (cancel)="cancelProfileImageCrop()">
          </app-profile-image-cropper>
          <div class="profile-image-link-field">
            <label class="field-label" for="become-professional-profile-image-url">קישור לתמונת פרופיל</label>
            <input
              id="become-professional-profile-image-url"
              type="url"
              [(ngModel)]="profileImageUrl"
              name="professionalProfileImageUrl"
              class="form-input"
              placeholder="https://..."
            >
          </div>
          <div class="profile-image-link-field">
            <label class="field-label" for="become-professional-banner-image-url">תמונת באנר</label>
            <div class="media-link-row">
              <input
                id="become-professional-banner-image-url"
                type="url"
                [(ngModel)]="bannerImageUrl"
                name="professionalBannerImageUrl"
                class="form-input"
                placeholder="https://..."
              >
              <button type="button" class="media-upload-btn" (click)="bannerInput.click()" [disabled]="bannerImageUploading">
                <span class="material-icons">{{ bannerImageUploading ? 'hourglass_empty' : 'attach_file' }}</span>
              </button>
              <input #bannerInput type="file" accept="image/*,.heic,.heif,.jxl" hidden (change)="onBannerImageSelected($event)">
            </div>
          </div>
        </div>

        <div class="field-grid">
          <input type="text" class="form-input field-full" [(ngModel)]="displayName" name="professionalDisplayName" placeholder="שם מלא *" required>
          <input type="email" class="form-input" [(ngModel)]="email" name="professionalEmail" placeholder="אימייל *" required>
          <div class="phone-line">
            <input type="tel" class="form-input" [(ngModel)]="phoneNumber" name="professionalPhone" placeholder="טלפון *" required>
            <label class="whatsapp-toggle">
              <input type="checkbox" [(ngModel)]="hasWhatsAppForPhone" name="professionalHasWhatsapp">
              <span>וואטסאפ</span>
            </label>
          </div>

          <div class="custom-dropdown">
            <div class="dropdown-selected">
              <input
                type="text"
                class="dropdown-search-input"
                [value]="cityDropdownOpen ? citySearchText : (cityId ? getSelectedCityName() : '')"
                (input)="onCityTextInput($event)"
                (focus)="openCityDropdown()"
                (blur)="onCityInputBlur()"
                name="citySearch"
                placeholder="עיר"
                autocomplete="off"
              />
              <span class="material-icons" (mousedown)="$event.preventDefault()" (click)="toggleCityDropdown()">expand_more</span>
            </div>
            <div class="dropdown-menu" *ngIf="cityDropdownOpen">
              <div class="dropdown-options">
                <div class="dropdown-option" (mousedown)="$event.preventDefault(); selectCity(city.id)" *ngFor="let city of filteredCities">
                  {{ city.name }}
                </div>
              </div>
            </div>
          </div>
          <input type="text" class="form-input" [(ngModel)]="location" placeholder="כתובת">

          <div class="custom-dropdown field-full" data-required-category data-required-anchor tabindex="-1">
            <div class="dropdown-selected" (click)="toggleCategoriesDropdown()">
              {{ getSelectedCategoryText() }}
              <span class="material-icons">expand_more</span>
            </div>
            <div class="dropdown-menu" *ngIf="categoriesDropdownOpen">
              <input type="text" class="dropdown-search" [(ngModel)]="categorySearchText" (ngModelChange)="onCategorySearchChange()" placeholder="חיפוש קטגוריה">
              <div class="dropdown-options">
                <div class="dropdown-option" *ngFor="let category of filteredCategories" (click)="selectCategory(category.id)" [class.selected]="selectedCategoryId === category.id">
                  {{ category.name }}
                </div>
              </div>
            </div>
          </div>

          <input type="number" class="form-input" [(ngModel)]="yearsOfExperience" min="0" placeholder="שנות ניסיון">
          <textarea class="form-textarea" [(ngModel)]="shortBio" rows="2" placeholder="תיאור קצר"></textarea>
        </div>
      </div>

      <div class="form-step" *ngIf="currentStep === 2">
        <div class="field-grid">
          <textarea class="form-textarea field-full" [(ngModel)]="fullDescription" rows="4" placeholder="תיאור מלא"></textarea>
          <input type="text" class="form-input" [(ngModel)]="workingHours" placeholder="שעות פעילות">
          <input type="url" class="form-input" [(ngModel)]="websiteUrl" placeholder="אתר אינטרנט">
        </div>

        <section class="mini-section">
          <h3>תגים לדף</h3>
          <div class="feature-tags-editor">
            <label class="feature-choice">
              <input type="radio" name="parkingType" [checked]="parkingType === ServiceProviderParkingType.None" (change)="parkingType = ServiceProviderParkingType.None">
              <span>ללא חניה</span>
            </label>
            <label class="feature-choice">
              <input type="radio" name="parkingType" [checked]="parkingType === ServiceProviderParkingType.ParkingAvailable" (change)="parkingType = ServiceProviderParkingType.ParkingAvailable">
              <span>חניה במקום</span>
            </label>
            <label class="feature-choice">
              <input type="radio" name="parkingType" [checked]="parkingType === ServiceProviderParkingType.FreeParking" (change)="parkingType = ServiceProviderParkingType.FreeParking">
              <span>חניה חינם</span>
            </label>
            <label class="feature-choice">
              <input type="checkbox" [(ngModel)]="hasAccessibleEntrance" name="hasAccessibleEntrance">
              <span>כניסה נגישה</span>
            </label>
            <label class="feature-choice">
              <input type="checkbox" [(ngModel)]="isAnash" name="isAnash">
              <span>מאנ"ש</span>
            </label>
          </div>
        </section>

        <section class="mini-section">
          <h3>רשתות חברתיות</h3>
          <div class="social-row">
            <button
              type="button"
              class="social-icon"
              *ngFor="let platform of SOCIAL_PLATFORMS; trackBy: trackBySocialPlatform"
              [class.active]="activeSocialPlatform === platform.value"
              [class.filled]="hasSocialUrl(platform.value)"
              (click)="selectSocialPlatform(platform.value)"
              [title]="platform.label">
              <span class="social-platform-icon" [innerHTML]="getSocialIconSvg(platform.value)"></span>
            </button>
          </div>
          <input
            *ngIf="activeSocialPlatform"
            type="url"
            class="form-input"
            [value]="getSocialUrl(activeSocialPlatform)"
            (input)="setSocialUrl(activeSocialPlatform, $event)"
            placeholder="קישור לפרופיל">
        </section>

        <section class="mini-section">
          <h3>גלריה</h3>
          <p>אפשר להעלות כמה תמונות יחד, ולהוסיף קישור וידאו באותו אזור.</p>
          <div class="gallery-actions">
            <label class="pill-action">
              <input type="file" accept="image/*" multiple hidden (change)="onGalleryFilesSelected($event)">
              <span class="material-icons">add_photo_alternate</span>
              <span>{{ galleryUploadingCount > 0 ? 'מעלה תמונות...' : 'הוספת תמונות' }}</span>
            </label>
            <button type="button" class="pill-action muted" (click)="showVideoLinkInput = !showVideoLinkInput">
              <span class="material-icons">link</span>
              <span>קישור וידאו</span>
            </button>
          </div>
          <input *ngIf="showVideoLinkInput" type="url" class="form-input" [(ngModel)]="videoUrl" placeholder="YouTube / Vimeo"
                 (blur)="validateVideoUrl(videoUrl)" (input)="validateVideoUrl(videoUrl)">
          <small class="field-error" *ngIf="videoUrlError">{{ videoUrlError }}</small>

          <div class="gallery-preview" *ngIf="galleryImages.length > 0 || videoUrl">
            <div class="gallery-item" *ngIf="videoUrl">
              <span class="material-icons">smart_display</span>
              <small>וידאו</small>
            </div>
            <div class="gallery-item" *ngFor="let img of galleryImages; let i = index">
              <img [src]="img.imageUrl" alt="">
              <button type="button" class="btn-remove-image" (click)="removeGalleryImage(i)">×</button>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" *ngIf="currentStep > 1" (click)="previousStep()" [disabled]="saving">
        <span class="material-icons">arrow_forward</span>
        הקודם
      </button>
      <button type="button" class="btn btn-primary" *ngIf="currentStep < totalSteps" (click)="nextStep()">
        הבא
        <span class="material-icons">arrow_back</span>
      </button>
      <button type="button" class="btn btn-primary" *ngIf="currentStep === totalSteps" (click)="onSubmit()" [disabled]="saving || galleryUploadingCount > 0">
        <span class="material-icons" *ngIf="!saving">send</span>
        <span class="spinner-small" *ngIf="saving"></span>
        {{ saving ? 'שולח...' : 'שלח בקשה' }}
      </button>
    </div>
  </div>
</div>
