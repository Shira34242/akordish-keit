<div class="blog-list-page" dir="rtl">

  <!-- Loading -->
  <div *ngIf="isLoading" class="page-loading">
    <div class="spinner"></div>
  </div>

  <!-- Error states -->
  <div *ngIf="loadFailed" class="page-error">
    <p>טעינת הבלוג נכשלה. אנא בדקו את החיבור ונסו שנית.</p>
  </div>

  <div *ngIf="hasError && !loadFailed" class="page-error">
    <p>אין פוסטים בבלוג להצגה כרגע.</p>
  </div>

  <!-- Content -->
  <ng-container *ngIf="!isLoading && !hasError && !loadFailed">
    <div class="news-content">
      <div class="managed-grid" *ngIf="managedArticles.length > 0">
        <div
          *ngFor="let slot of managedSlots"
          class="managed-cell"
          [ngClass]="'mc-' + (slot + 1)">
          <app-news-banner *ngIf="managedArticles[slot]" [article]="managedArticles[slot]"></app-news-banner>
          <div *ngIf="!managedArticles[slot]" class="cell-skeleton"></div>
        </div>
      </div>

      <div class="stream-grid">
        <div
          class="stream-cell"
          *ngFor="let article of streamArticles; let i = index"
          [ngClass]="getCellClass(i)">
          <app-news-banner [article]="article"></app-news-banner>
        </div>
      </div>

      <div #sentinel class="sentinel"></div>

      <div *ngIf="isLoadingMore" class="loading-more">
        <div class="spinner"></div>
      </div>
    </div>
  </ng-container>

  <!-- Floating Tab Navigation -->
  <nav class="tab-bar" dir="rtl">
    <a class="tab-bar__item" routerLink="/music-news">חדשות</a>
    <a class="tab-bar__item tab-bar__item--active" routerLink="/blog">בלוג</a>
    <a class="tab-bar__item" routerLink="/events">הופעות</a>
  </nav>

</div>
