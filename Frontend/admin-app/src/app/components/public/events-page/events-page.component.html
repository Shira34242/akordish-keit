<div class="events-page"
  dir="rtl"
  (wheel)="onWheel($event)"
  (mousedown)="onMouseDown($event)"
  (mousemove)="onMouseMove($event)"
  (mouseup)="onMouseUp()"
  (mouseleave)="onMouseUp()"
  (touchstart)="onTouchStart($event)"
  (touchmove)="onTouchMove($event)"
  (touchend)="onMouseUp()">

  <!-- Title + filters -->
  <div class="events-header">
    <h1 class="events-title">הופעות</h1>
    <div class="filter-pills">
      <button class="filter-pill" [class.filter-pill--active]="filterMode === 'upcoming'" (click)="setFilter('upcoming')">קרובות</button>
      <button class="filter-pill" [class.filter-pill--active]="filterMode === 'all'"      (click)="setFilter('all')">הכל</button>
      <button class="filter-pill" [class.filter-pill--active]="filterMode === 'past'"     (click)="setFilter('past')">שעברו</button>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="state-center">
    <div class="spinner"></div>
  </div>

  <!-- Empty -->
  <div *ngIf="!loading && filteredEvents.length === 0" class="state-center">
    <span class="material-icons empty-icon">local_activity</span>
    <p class="empty-text">אין הופעות להצגה</p>
  </div>

  <!-- Carousel -->
  <div class="carousel" *ngIf="!loading && filteredEvents.length > 0">
    <div
      class="carousel-item"
      #carouselItem
      *ngFor="let event of filteredEvents; let i = index; trackBy: trackById"
      (click)="onItemClick(i, event)">

      <div class="carousel-box">
        <img *ngIf="event.imageUrl" [src]="event.imageUrl" [alt]="event.name" class="slide-img" draggable="false">
        <div *ngIf="!event.imageUrl" class="slide-placeholder">
          <span class="material-icons">music_note</span>
        </div>

        <span class="slide-badge" [class.slide-badge--past]="event.isPast">
          {{ event.isPast ? 'הסתיים' : event.eventStatus }}
        </span>

        <div class="slide-info">
          <h3 class="slide-name">{{ event.name }}</h3>
          <p class="slide-meta" *ngIf="getArtist(event) || event.location">
            <span *ngIf="getArtist(event)">{{ getArtist(event) }}</span>
            <span *ngIf="getArtist(event) && event.location"> · </span>
            <span *ngIf="event.location">{{ event.location }}</span>
          </p>
          <p class="slide-date">{{ formatDate(event.eventDate) }}</p>
          <a *ngIf="event.ticketUrl && !event.isPast"
             [href]="event.ticketUrl"
             target="_blank" rel="noopener"
             class="slide-ticket"
             (click)="$event.stopPropagation()">
            לכרטיסים
          </a>
        </div>
      </div>

    </div>
  </div>

  <!-- Floating Tab Navigation -->
  <nav class="tab-bar" dir="rtl">
    <a class="tab-bar__item" routerLink="/music-news">חדשות</a>
    <a class="tab-bar__item" routerLink="/blog">בלוג</a>
    <a class="tab-bar__item tab-bar__item--active" routerLink="/events">הופעות</a>
  </nav>

</div>

<app-event-modal
  [event]="selectedEvent"
  (close)="selectedEvent = null">
</app-event-modal>
