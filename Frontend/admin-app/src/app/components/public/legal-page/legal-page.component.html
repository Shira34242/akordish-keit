<section class="legal-page">
  <div class="legal-page__inner">
    <a *ngIf="isContactPage" class="legal-page__back" routerLink="/">חזרה לאתר</a>

    <header class="legal-page__header">
      <span class="legal-page__eyebrow">מידע רשמי</span>
      <h1>{{ page.title }}</h1>
      <p>{{ page.description }}</p>
      <nav class="legal-page__related" *ngIf="page.relatedLinks?.length" aria-label="מסמכים קשורים">
        <a *ngFor="let link of page.relatedLinks" [routerLink]="link.path">{{ link.label }}</a>
      </nav>
      <button *ngIf="isContactPage" type="button" class="legal-page__primary" (click)="openContactForm()">
        פתיחת טופס צור קשר
      </button>
      <ng-container *ngIf="isAccountDeletionPage">
        <button
          *ngIf="(currentUser$ | async); else accountDeletionByEmail"
          type="button"
          class="legal-page__primary"
          [disabled]="accountDeletionPending || accountDeletionRequested"
          (click)="requestAccountDeletion()">
          {{ accountDeletionRequested ? 'הבקשה נשלחה' : accountDeletionPending ? 'שולחים בקשה...' : 'שליחת בקשת מחיקה' }}
        </button>
        <ng-template #accountDeletionByEmail>
          <a class="legal-page__primary legal-page__primary--link" href="mailto:akordishkayt@gmail.com?subject=בקשה למחיקת חשבון">שליחת בקשה במייל</a>
        </ng-template>
      </ng-container>
    </header>

    <div class="legal-page__content">
      <section class="legal-page__section" *ngFor="let section of page.sections">
        <h2>{{ section.title }}</h2>
        <p>{{ section.body }}</p>
      </section>
    </div>
  </div>
</section>
