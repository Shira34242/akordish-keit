<div class="bento-page" dir="rtl">

  <div *ngIf="isLoading" class="loading-container">
    <div class="loading-spinner"></div>
  </div>

  <ng-container *ngIf="!isLoading">

    <!-- ══════════════════════════════════════
         Hero
         [title 2×1]    [art-1 4×2]
         [art-2 2×2]    [art-1 cont.]
         [art-2 cont.]  [art-3 4×1]
    ══════════════════════════════════════ -->
    <div class="bento-grid hero-grid">

      <div class="label-cell hero-title-cell">
        <span class="label-text">חדשות המוזיקה</span>
      </div>

      <div class="bento-cell hero-cell-1">
        <app-news-banner *ngIf="featuredArticles[0]" [article]="featuredArticles[0].article"></app-news-banner>
        <div *ngIf="!featuredArticles[0]" class="skeleton-fill"></div>
      </div>
      <div class="bento-cell hero-cell-2">
        <app-news-banner *ngIf="featuredArticles[1]" [article]="featuredArticles[1].article"></app-news-banner>
        <div *ngIf="!featuredArticles[1]" class="skeleton-fill"></div>
      </div>
      <div class="bento-cell hero-cell-3">
        <app-news-banner *ngIf="featuredArticles[2]" [article]="featuredArticles[2].article"></app-news-banner>
        <div *ngIf="!featuredArticles[2]" class="skeleton-fill"></div>
      </div>
      <div class="bento-cell hero-cell-4">
        <app-news-banner *ngIf="featuredArticles[3]" [article]="featuredArticles[3].article"></app-news-banner>
        <div *ngIf="!featuredArticles[3]" class="skeleton-fill"></div>
      </div>

    </div>

    <!-- ══════════════════════════════════════
         קטגוריות דינמיות
         הגריד ממלא את כל 6 העמודות — ללא תא expand
         כפתור expand = pill קטן מחוץ לגריד
    ══════════════════════════════════════ -->
    <ng-container *ngFor="let section of sections; let i = index">
      <div class="section-wrapper" *ngIf="section.articles.length > 0">

        <!-- גריד הקטגוריה -->
        <div class="bento-grid section-grid" [ngClass]="'layout-' + getSectionLayout(i)">

          <div class="label-cell section-label" (click)="navigateToSection(section)">
            <span class="label-text">{{ section.title }}</span>
            <span class="label-link">לכל התוכן ›</span>
          </div>

          <div class="bento-cell art-cell-1" *ngIf="section.articles[0]">
            <app-news-banner [article]="section.articles[0]"></app-news-banner>
          </div>
          <div class="bento-cell art-cell-2" *ngIf="section.articles[1]">
            <app-news-banner [article]="section.articles[1]"></app-news-banner>
          </div>
          <div class="bento-cell art-cell-3" *ngIf="section.articles[2]">
            <app-news-banner [article]="section.articles[2]"></app-news-banner>
          </div>
          <div class="bento-cell art-cell-4" *ngIf="section.articles[3] && getInitialArticleCount(i) >= 4">
            <app-news-banner [article]="section.articles[3]"></app-news-banner>
          </div>
          <div class="bento-cell art-cell-5" *ngIf="section.articles[4] && getInitialArticleCount(i) >= 5">
            <app-news-banner [article]="section.articles[4]"></app-news-banner>
          </div>

        </div>

        <!-- כפתור expand — pill קטן, מחוץ לגריד, צמוד שמאל -->
        <div class="expand-row">
          <button class="expand-pill" (click)="toggleSection(i)">
            {{ isExpanded(i) ? '↑ פחות' : 'עוד ›' }}
          </button>
        </div>

        <!-- גריד הרחבה -->
        <ng-container *ngIf="isExpanded(i)">
          <div class="bento-grid expanded-grid">
            <div class="bento-cell art-extra"
                 *ngFor="let article of section.articles | slice:getInitialArticleCount(i)">
              <app-news-banner [article]="article"></app-news-banner>
            </div>
          </div>
        </ng-container>

      </div>
    </ng-container>

  </ng-container>

</div>
