<div class="music-news-page" dir="rtl">

  <!-- Loading -->
  <div class="loading-container" *ngIf="isLoading">
    <div class="loading-spinner"></div>
  </div>

  <ng-container *ngIf="!isLoading">

    <!-- ══════════════════════════════════════
         Floating bar: category label + expand btn
    ══════════════════════════════════════ -->
    <div class="float-bar">
      <span class="category-label" [class.visible]="labelVisible">
        {{ categories[activeCategory].label }}
      </span>
      <button class="expand-btn" (click)="expandCategory(activeCategory)">עוד ›</button>
    </div>

    <!-- ══════════════════════════════════════
         Dot Nav — fixed bottom center
    ══════════════════════════════════════ -->
    <nav class="dot-nav" aria-label="ניווט בין קטגוריות">
      <button class="dot"
              *ngFor="let cat of categories"
              [class.active]="activeCategory === cat.index"
              (click)="switchTo(cat.index, cat.index > activeCategory ? 'down' : 'up')"
              [attr.aria-label]="cat.label">
      </button>
    </nav>

    <!-- ══════════════════════════════════════
         Layout A — ראשי (2 big + 3 small)
    ══════════════════════════════════════ -->
    <div class="grid-wrapper layout-a"
         *ngIf="isGridVisible(0)"
         [ngClass]="getGridClasses(0)">
      <div class="bento-cell cell-1">
        <app-news-banner *ngIf="featuredArticles[0]" [article]="featuredArticles[0].article"></app-news-banner>
        <div *ngIf="!featuredArticles[0]" class="skeleton-fill"></div>
      </div>
      <div class="bento-cell cell-2">
        <app-news-banner *ngIf="featuredArticles[1]" [article]="featuredArticles[1].article"></app-news-banner>
        <div *ngIf="!featuredArticles[1]" class="skeleton-fill"></div>
      </div>
      <div class="bento-cell cell-3">
        <app-news-banner *ngIf="featuredArticles[2]" [article]="featuredArticles[2].article"></app-news-banner>
        <div *ngIf="!featuredArticles[2]" class="skeleton-fill"></div>
      </div>
      <div class="bento-cell cell-4">
        <app-news-banner *ngIf="featuredArticles[3]" [article]="featuredArticles[3].article"></app-news-banner>
        <div *ngIf="!featuredArticles[3]" class="skeleton-fill"></div>
      </div>
      <div class="bento-cell cell-5">
        <app-news-banner *ngIf="featuredArticles[4]" [article]="featuredArticles[4].article"></app-news-banner>
        <div *ngIf="!featuredArticles[4]" class="skeleton-fill"></div>
      </div>
    </div>

    <!-- ══════════════════════════════════════
         Layout B — פופולאריים (dominant + right col + bottom row)
    ══════════════════════════════════════ -->
    <div class="grid-wrapper layout-b"
         *ngIf="isGridVisible(1)"
         [ngClass]="getGridClasses(1)">
      <div class="bento-cell cell-1">
        <app-news-banner *ngIf="popularArticles[0]" [article]="popularArticles[0]"></app-news-banner>
        <div *ngIf="!popularArticles[0]" class="skeleton-fill"></div>
      </div>
      <div class="bento-cell cell-2">
        <app-news-banner *ngIf="popularArticles[1]" [article]="popularArticles[1]"></app-news-banner>
        <div *ngIf="!popularArticles[1]" class="skeleton-fill"></div>
      </div>
      <div class="bento-cell cell-3">
        <app-news-banner *ngIf="popularArticles[2]" [article]="popularArticles[2]"></app-news-banner>
        <div *ngIf="!popularArticles[2]" class="skeleton-fill"></div>
      </div>
      <div class="bento-cell cell-4">
        <app-news-banner *ngIf="popularArticles[3]" [article]="popularArticles[3]"></app-news-banner>
        <div *ngIf="!popularArticles[3]" class="skeleton-fill"></div>
      </div>
      <div class="bento-cell cell-5">
        <app-news-banner *ngIf="popularArticles[4]" [article]="popularArticles[4]"></app-news-banner>
        <div *ngIf="!popularArticles[4]" class="skeleton-fill"></div>
      </div>
      <div class="bento-cell cell-6">
        <app-news-banner *ngIf="popularArticles[5]" [article]="popularArticles[5]"></app-news-banner>
        <div *ngIf="!popularArticles[5]" class="skeleton-fill"></div>
      </div>
    </div>

    <!-- ══════════════════════════════════════
         Layout C — תוכן (9 uniform cells)
    ══════════════════════════════════════ -->
    <div class="grid-wrapper layout-c"
         *ngIf="isGridVisible(2)"
         [ngClass]="getGridClasses(2)">
      <div class="bento-cell" *ngFor="let article of blogArticles | slice:0:9">
        <app-news-banner [article]="article"></app-news-banner>
      </div>
    </div>

    <!-- ══════════════════════════════════════
         Layout D — קליפים (3 cells: big top + 2 bottom)
    ══════════════════════════════════════ -->
    <div class="grid-wrapper layout-d"
         *ngIf="isGridVisible(3)"
         [ngClass]="getGridClasses(3)">
      <div class="bento-cell cell-1">
        <app-news-banner *ngIf="clipsArticles[0]" [article]="clipsArticles[0]"></app-news-banner>
        <div *ngIf="!clipsArticles[0]" class="skeleton-fill"></div>
      </div>
      <div class="bento-cell cell-2">
        <app-news-banner *ngIf="clipsArticles[1]" [article]="clipsArticles[1]"></app-news-banner>
        <div *ngIf="!clipsArticles[1]" class="skeleton-fill"></div>
      </div>
      <div class="bento-cell cell-3">
        <app-news-banner *ngIf="clipsArticles[2]" [article]="clipsArticles[2]"></app-news-banner>
        <div *ngIf="!clipsArticles[2]" class="skeleton-fill"></div>
      </div>
    </div>

    <!-- ══════════════════════════════════════
         Expanded overlay — גלילה חופשית
    ══════════════════════════════════════ -->
    <div class="expanded-overlay"
         *ngIf="expandedCategory !== null"
         [class.closing]="expandedClosing">

      <div class="expanded-header">
        <span class="category-label visible">{{ categories[expandedCategory!].label }}</span>
        <button class="expanded-close-btn" (click)="collapseCategory()">סגור ✕</button>
      </div>

      <div class="expanded-grid">

        <!-- ראשי -->
        <ng-container *ngIf="expandedCategory === 0">
          <div class="expanded-cell" *ngFor="let fc of featuredArticles">
            <app-news-banner [article]="fc.article"></app-news-banner>
          </div>
        </ng-container>

        <!-- פופולאריים -->
        <ng-container *ngIf="expandedCategory === 1">
          <div class="expanded-cell" *ngFor="let article of popularArticles">
            <app-news-banner [article]="article"></app-news-banner>
          </div>
        </ng-container>

        <!-- תוכן -->
        <ng-container *ngIf="expandedCategory === 2">
          <div class="expanded-cell" *ngFor="let article of blogArticles">
            <app-news-banner [article]="article"></app-news-banner>
          </div>
        </ng-container>

        <!-- קליפים -->
        <ng-container *ngIf="expandedCategory === 3">
          <div class="expanded-cell" *ngFor="let article of clipsArticles">
            <app-news-banner [article]="article"></app-news-banner>
          </div>
        </ng-container>

      </div>

      <!-- תחתית: המשך לקטגוריה הבאה -->
      <div class="expanded-footer">
        <button class="continue-btn" (click)="collapseAndNext()">
          {{ expandedCategory! < categories.length - 1 ? 'לקטגוריה הבאה ›' : 'חזרה לדף' }}
        </button>
      </div>

    </div>

  </ng-container>

</div>
