<div class="music-news-page" dir="rtl">

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-container">
    <div class="loading-spinner"></div>
  </div>

  <!-- Main Content -->
  <div *ngIf="!isLoading">

    <!-- Bento Hero — מלא מסך -->
    <section class="bento-hero">
      <div class="bento-news-grid">

        <div class="bento-cell bento-cell-1">
          <app-news-banner *ngIf="featuredArticles[0]" [article]="featuredArticles[0].article"></app-news-banner>
          <div *ngIf="!featuredArticles[0]" class="skeleton-fill"></div>
        </div>

        <div class="bento-cell bento-cell-2">
          <app-news-banner *ngIf="featuredArticles[1]" [article]="featuredArticles[1].article"></app-news-banner>
          <div *ngIf="!featuredArticles[1]" class="skeleton-fill"></div>
        </div>

        <div class="bento-cell bento-cell-3">
          <app-news-banner *ngIf="featuredArticles[2]" [article]="featuredArticles[2].article"></app-news-banner>
          <div *ngIf="!featuredArticles[2]" class="skeleton-fill"></div>
        </div>

        <div class="bento-cell bento-cell-4">
          <app-news-banner *ngIf="featuredArticles[3]" [article]="featuredArticles[3].article"></app-news-banner>
          <div *ngIf="!featuredArticles[3]" class="skeleton-fill"></div>
        </div>

        <div class="bento-cell bento-cell-5">
          <app-news-banner *ngIf="featuredArticles[4]" [article]="featuredArticles[4].article"></app-news-banner>
          <div *ngIf="!featuredArticles[4]" class="skeleton-fill"></div>
        </div>

      </div>
    </section>

    <!-- Category Sections — מקצה לקצה -->
    <div class="sections-wrapper">

      <!-- פופולאריים -->
      <section class="news-section">
        <div class="section-header">
          <span class="category-pill">פופולאריים</span>
          <span class="section-link" (click)="navigateToCategory(10)">הצג הכל ›</span>
        </div>
        <app-carousel title="" linkText="" linkUrl="/">
          <ng-container *ngIf="popularArticles.length > 0; else sk1">
            <div class="scroll-item" *ngFor="let article of popularArticles">
              <app-news-banner [article]="article"></app-news-banner>
            </div>
          </ng-container>
          <ng-template #sk1>
            <div class="scroll-item" *ngFor="let i of [1,2,3,4,5]">
              <div class="skeleton-banner"></div>
            </div>
          </ng-template>
        </app-carousel>
      </section>

      <!-- תוכן -->
      <section class="news-section">
        <div class="section-header">
          <span class="category-pill">תוכן</span>
          <span class="section-link" (click)="navigateToContentType(1)">הצג הכל ›</span>
        </div>
        <app-carousel title="" linkText="" linkUrl="/">
          <ng-container *ngIf="blogArticles.length > 0; else sk2">
            <div class="scroll-item" *ngFor="let article of blogArticles">
              <app-news-banner [article]="article"></app-news-banner>
            </div>
          </ng-container>
          <ng-template #sk2>
            <div class="scroll-item" *ngFor="let i of [1,2,3,4,5]">
              <div class="skeleton-banner"></div>
            </div>
          </ng-template>
        </app-carousel>
      </section>

      <!-- קליפים -->
      <section class="news-section">
        <div class="section-header">
          <span class="category-pill">קליפים</span>
          <span class="section-link" (click)="navigateToCategory(11)">הצג הכל ›</span>
        </div>
        <app-carousel title="" linkText="" linkUrl="/">
          <ng-container *ngIf="clipsArticles.length > 0; else sk3">
            <div class="scroll-item" *ngFor="let article of clipsArticles">
              <app-news-banner [article]="article"></app-news-banner>
            </div>
          </ng-container>
          <ng-template #sk3>
            <div class="scroll-item" *ngFor="let i of [1,2,3,4,5]">
              <div class="skeleton-banner"></div>
            </div>
          </ng-template>
        </app-carousel>
      </section>

      <!-- הופעות קרובות -->
      <section class="news-section events-section">
        <div class="section-header">
          <span class="category-pill">הופעות קרובות</span>
        </div>
        <ng-container *ngIf="upcomingEvents.length > 0; else eventsSkeleton">
          <div class="events-list">
            <div class="event-card" *ngFor="let event of upcomingEvents" (click)="openTicketLink(event)">
              <div class="event-image-wrap">
                <img [src]="event.imageUrl || 'assets/default-event.png'" [alt]="event.name" class="event-img">
              </div>
              <div class="event-info">
                <span class="event-status-badge" [class.past]="event.eventStatus === 'אירוע שחלף'">
                  {{ event.eventStatus }}
                </span>
                <h3 class="event-name">{{ event.name }}</h3>
                <p class="event-artist" *ngIf="event.artistName || (event.taggedArtistNames?.length ?? 0) > 0">
                  {{ event.artistName || event.taggedArtistNames[0] }}
                </p>
                <p class="event-location" *ngIf="event.location">{{ event.location }}</p>
              </div>
              <div class="event-date-col">
                <span class="event-date">{{ event.eventDate | date:'dd/MM' }}</span>
                <span class="event-ticket-btn">כרטיסים ›</span>
              </div>
            </div>
          </div>
        </ng-container>
        <ng-template #eventsSkeleton>
          <div class="events-list">
            <div class="skeleton-event" *ngFor="let i of [1,2,3]"></div>
          </div>
        </ng-template>
      </section>

    </div>

  </div>

</div>
