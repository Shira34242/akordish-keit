<div class="music-news-page" dir="rtl">

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-container">
    <div class="loading-spinner"></div>
  </div>

  <!-- Main Content -->
  <div *ngIf="!isLoading">

    <!-- Hero Header — scroll-shrink fixed -->
    <div class="page-hero" #pageHero>
      <div class="hero-collapse-overlay"></div>
      <div class="hero-inner">
        <h1 class="page-title">חדשות<br>המוזיקה</h1>
      </div>
    </div>

    <!-- Spacer לגובה ה-hero -->
    <div class="hero-spacer"></div>

    <!-- Page Body -->
    <div class="page-body">

      <!-- 4 כתבות מרכזיות -->
      <section class="featured-section" *ngIf="featuredArticles.length > 0">
        <div class="featured-grid">
          <div
            *ngFor="let featured of featuredArticles"
            class="featured-item"
            (click)="navigateToFeaturedArticle(featured)"
          >
            <img [src]="featured.article.featuredImageUrl" [alt]="featured.article.title" class="featured-img" loading="lazy">
            <div class="featured-overlay">
              <h3 class="featured-title">{{ featured.article.title }}</h3>
            </div>
          </div>
        </div>
      </section>

      <!-- תוכן העמוד -->
      <div class="page-content">

        <!-- פופולאריים -->
        <section class="page-section" *ngIf="popularArticles.length > 0">
          <div class="section-header">
            <h2 class="section-title">פופולאריים</h2>
            <span class="section-link" (click)="navigateToCategory(10)">לכל הפופולאריים ‹</span>
          </div>
          <div class="news-grid">
            <app-news-banner *ngFor="let article of popularArticles" [article]="article"></app-news-banner>
          </div>
        </section>

        <!-- תוכן (בלוגים) -->
        <section class="page-section" *ngIf="blogArticles.length > 0">
          <div class="section-header">
            <h2 class="section-title">תוכן</h2>
            <span class="section-link" (click)="navigateToContentType(1)">לכל התוכן ‹</span>
          </div>
          <div class="news-grid">
            <app-news-banner *ngFor="let article of blogArticles" [article]="article"></app-news-banner>
          </div>
        </section>

        <!-- הופעות קרובות -->
        <section class="page-section" *ngIf="upcomingEvents.length > 0">
          <div class="section-header">
            <h2 class="section-title">הופעות קרובות</h2>
          </div>
          <div class="events-list">
            <div class="event-card" *ngFor="let event of upcomingEvents" (click)="openTicketLink(event)">
              <div class="event-image-wrap">
                <img [src]="event.imageUrl || 'assets/default-event.png'" [alt]="event.name" class="event-img">
              </div>
              <div class="event-info">
                <span class="event-status-badge" [class.past]="event.eventStatus === 'אירוע שחלף'">
                  {{ event.eventStatus }}
                </span>
                <h3 class="event-name">{{ event.name }}</h3>
                <p class="event-artist" *ngIf="event.artistName || (event.taggedArtistNames?.length ?? 0) > 0">
                  {{ event.artistName || event.taggedArtistNames[0] }}
                </p>
                <p class="event-location" *ngIf="event.location">{{ event.location }}</p>
              </div>
              <div class="event-date-col">
                <span class="event-date">{{ event.eventDate | date:'dd/MM' }}</span>
                <span class="event-ticket-btn">כרטיסים ‹</span>
              </div>
            </div>
          </div>
        </section>

        <!-- קליפים -->
        <section class="page-section" *ngIf="clipsArticles.length > 0">
          <div class="section-header">
            <h2 class="section-title">קליפים</h2>
            <span class="section-link" (click)="navigateToCategory(11)">לכל הקליפים ‹</span>
          </div>
          <div class="news-grid">
            <app-news-banner *ngFor="let article of clipsArticles" [article]="article"></app-news-banner>
          </div>
        </section>

      </div>
    </div>
  </div>
</div>
