<div class="music-news-page">

  <div *ngIf="isLoading" class="page-loading">
    <div class="spinner"></div>
  </div>

  <div *ngIf="loadFailed" class="page-error">
    <p>{{ 'news.load_failed' | translate }}</p>
  </div>

  <div *ngIf="hasError && !loadFailed" class="page-error">
    <p>{{ 'news.no_content' | translate }}</p>
  </div>

  <ng-container *ngIf="!isLoading && !hasError && !loadFailed">
    <div class="news-content">
      <div class="managed-grid">
        <div
          class="managed-row"
          *ngFor="let row of getManagedRows()"
          [ngStyle]="{'grid-template-columns': row.gridCols}">
          <div class="managed-cell" *ngFor="let slot of row.slots">
            <app-news-banner *ngIf="getManagedArticle(slot)" [article]="getManagedArticle(slot)!" (click)="navigateToArticle(getManagedArticle(slot)!)"></app-news-banner>
            <div *ngIf="!getManagedArticle(slot)" class="cell-skeleton"></div>
          </div>
        </div>
      </div>

      <div class="stream-grid">
        <div
          class="stream-row"
          *ngFor="let row of getStreamRows()"
          [ngStyle]="{'grid-template-columns': row.gridCols}">
          <div
            class="stream-cell"
            *ngFor="let article of row.articles">
            <app-news-banner [article]="article" (click)="navigateToArticle(article)"></app-news-banner>
          </div>
        </div>
      </div>

      <div #sentinel class="sentinel"></div>

      <div *ngIf="isLoadingMore" class="loading-more">
        <div class="spinner"></div>
      </div>
    </div>
  </ng-container>

</div>
