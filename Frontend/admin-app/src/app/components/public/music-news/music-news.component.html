<div class="music-news-page">

  <div *ngIf="isLoading" class="page-loading">
    <div class="spinner"></div>
  </div>

  <div *ngIf="loadFailed" class="page-error">
    <p>{{ 'news.load_failed' | translate }}</p>
  </div>

  <div *ngIf="hasError && !loadFailed" class="page-error">
    <p>{{ 'news.no_content' | translate }}</p>
  </div>

  <ng-container *ngIf="!isLoading && !hasError && !loadFailed">
    <div class="news-content">
      <div class="managed-grid">
        <div
          *ngFor="let slot of managedSlots"
          class="managed-cell"
          [ngClass]="'mc-' + (slot + 1)">
          <app-news-banner *ngIf="getFeaturedArticle(slot)" [article]="getFeaturedArticle(slot)!"></app-news-banner>
          <div *ngIf="!getFeaturedArticle(slot)" class="cell-skeleton"></div>
        </div>
      </div>

      <div class="stream-grid">
        <div
          class="stream-cell"
          *ngFor="let article of newsArticles; let i = index"
          [ngClass]="getCellClass(i)">
          <app-news-banner [article]="article"></app-news-banner>
        </div>
      </div>

      <div #sentinel class="sentinel"></div>

      <div *ngIf="isLoadingMore" class="loading-more">
        <div class="spinner"></div>
      </div>
    </div>
  </ng-container>

  <nav class="tab-bar">
    <a class="tab-bar__item tab-bar__item--active" routerLink="/music-news">{{ 'events.tab_news' | translate }}</a>
    <a class="tab-bar__item" routerLink="/blog">{{ 'events.tab_blog' | translate }}</a>
    <a class="tab-bar__item" routerLink="/events">{{ 'events.tab_events' | translate }}</a>
  </nav>

</div>
