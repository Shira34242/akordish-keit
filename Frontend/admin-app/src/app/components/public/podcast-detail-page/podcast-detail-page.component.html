<main class="podcast-detail" dir="rtl">
  <div *ngIf="loading" class="podcast-state">טוען סדרה...</div>

  <ng-container *ngIf="!loading && podcast">
    <section class="podcast-hero" [class.has-image]="!!podcast.imageUrl">
      <div class="podcast-hero__image" [style.background-image]="podcast.imageUrl ? 'url(' + podcast.imageUrl + ')' : ''">
        <span *ngIf="!podcast.imageUrl" class="material-icons">podcasts</span>
      </div>
      <div class="podcast-hero__copy">
        <a routerLink="/podcasts" class="back-link">כל הפודקאסטים</a>
        <h1>{{ podcast.name }}</h1>
        <p>{{ podcast.description || 'כל פרקי הסדרה במקום אחד.' }}</p>
        <span class="episode-count">{{ podcast.episodeCount }} פרקים</span>
      </div>
    </section>

    <section class="featured-episode" *ngIf="latestEpisode as episode">
      <div class="featured-episode__image" [style.background-image]="episode.thumbnailUrl ? 'url(' + episode.thumbnailUrl + ')' : ''">
        <span class="material-icons" *ngIf="!episode.thumbnailUrl">play_circle</span>
      </div>
      <div class="featured-episode__copy">
        <span class="section-label">פרק אחרון</span>
        <h2>{{ episode.title }}</h2>
        <p>{{ episode.description || podcast.name }}</p>
        <a class="play-link" [routerLink]="['/podcasts', episode.podcastSlug, episode.slug]">צפייה בפרק</a>
      </div>
    </section>

    <section class="episodes-section">
      <div class="section-header">
        <h2>פרקי הסדרה</h2>
      </div>
      <div class="episodes-list">
        <app-podcast-episode-card
          *ngFor="let episode of podcast.episodes; trackBy: trackById"
          [episode]="episode">
        </app-podcast-episode-card>
      </div>
    </section>
  </ng-container>

  <div *ngIf="!loading && !podcast" class="podcast-state">הפודקאסט לא נמצא.</div>
</main>
