<div class="artist-circle" [routerLink]="artistLink">
    <div class="image-wrapper">
        <img [src]="(artist.imageUrl | cfImage:240:82) || 'assets/default-artist.png'" [alt]="artist.name" class="artist-image" loading="lazy" decoding="async" [imgFallbackOriginal]="artist.imageUrl" imgFallback="assets/default-artist.png">
    </div>
    <h3 class="artist-name">{{ artist.name }}</h3>
    <p class="song-count">{{ artist.songCount || 0 }} שירים באתר</p>
</div>
