<div *ngIf="ids.length > 0" class="modal-backdrop" (click)="close.emit()">
  <div class="modal-container" (click)="$event.stopPropagation()">

    <div class="modal-top-bar">
      <h2 class="modal-title">הקפצת {{ entityLabel() }}</h2>
      <button class="overlay-pill overlay-pill--close" (click)="close.emit()" aria-label="סגור">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="modal-body">
      <p class="bump-count">נבחרו {{ ids.length }} {{ entityLabel() }}</p>

      <button class="bump-btn bump-btn--now" (click)="bumpNow()" [disabled]="loading">
        <span class="material-icons">trending_up</span>
        הקפצה ל־24 שעות
      </button>
      <p class="bump-note">הפריטים יקבלו קדימות למשך 24 שעות ולאחר מכן יחזרו לסדר הרגיל.</p>
    </div>

  </div>
</div>
