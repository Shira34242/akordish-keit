<button
  type="button"
  class="event-card"
  [class.event-card--past]="isPast"
  (click)="cardClick.emit(event)"
  [attr.aria-label]="event.name">

  <!-- פוסטר -->
  <div class="event-card__poster">
    <img
      *ngIf="posterImageUrl"
      [src]="(posterImageUrl | cfImage:imageWidth:82) || posterImageUrl"
      [attr.srcset]="posterImageUrl | cfSrcset:[220, 440, 720]:80"
      [attr.sizes]="imageSizes"
      [alt]="event.name"
      class="event-card__poster-img"
      width="360"
      height="480"
      loading="lazy"
      decoding="async"
      [imgFallbackOriginal]="posterImageUrl"
      imgFallback="/logo.png">
    <div *ngIf="!posterImageUrl" class="event-card__poster-placeholder">
      <span class="material-icons">music_note</span>
    </div>
    <!-- Badge על גבי התמונה -->
    <span class="event-card__badge" [ngClass]="badgeClass">
      {{ isPast ? ('shared.ended' | translate) : event.eventStatus }}
    </span>
  </div>

  <!-- פרטים מתחת לתמונה -->
  <div class="event-card__info" *ngIf="showInfo">
    <h3 class="event-card__name" *ngIf="hasTitle">{{ event.name }}</h3>
    <p class="event-card__meta">
      <ng-container *ngIf="displayArtist">{{ displayArtist }} · </ng-container>{{ formattedDate }}
    </p>
  </div>

</button>
