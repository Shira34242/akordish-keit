<div
  class="event-card"
  [class.event-card--past]="isPast"
  (click)="cardClick.emit(event)"
  role="button"
  [attr.aria-label]="event.name">

  <!-- פוסטר -->
  <div class="event-card__poster">
    <img
      *ngIf="event.imageUrl"
      [src]="event.imageUrl"
      [alt]="event.name"
      class="event-card__poster-img"
      loading="lazy"
      decoding="async"
      imgFallback="/logo.png">
    <div *ngIf="!event.imageUrl" class="event-card__poster-placeholder">
      <span class="material-icons">music_note</span>
    </div>
    <!-- Badge על גבי התמונה -->
    <span class="event-card__badge" [ngClass]="badgeClass">
      {{ isPast ? ('shared.ended' | translate) : event.eventStatus }}
    </span>
  </div>

  <!-- פרטים מתחת לתמונה -->
  <div class="event-card__info">
    <h3 class="event-card__name">{{ event.name }}</h3>
    <p class="event-card__meta">
      <ng-container *ngIf="displayArtist">{{ displayArtist }} · </ng-container>{{ formattedDate }}
    </p>
  </div>

</div>
