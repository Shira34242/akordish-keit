<div *ngIf="event" class="modal-backdrop" (click)="close.emit()">
  <div class="modal-container" (click)="$event.stopPropagation()">

    <img
      *ngIf="event.imageUrl"
      [src]="event.imageUrl | cfImage:'hero'"
      [alt]="event.name"
      class="modal-img">
    <div *ngIf="!event.imageUrl" class="modal-placeholder">
      <span class="material-icons">music_note</span>
    </div>

    <div class="modal-top-bar">
      <span class="overlay-pill overlay-pill--badge" [class.overlay-pill--past]="isPast">
        {{ isPast ? ('shared.ended' | translate) : event.eventStatus }}
      </span>
      <button class="overlay-pill overlay-pill--close" (click)="close.emit()" [attr.aria-label]="'shared.close' | translate">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="modal-bottom-bar">
      <div class="modal-info">
        <h2 class="modal-name" *ngIf="hasTitle">{{ event.name }}</h2>
        <p class="modal-meta" *ngIf="displayArtist || event.location">
          <span *ngIf="displayArtist">{{ displayArtist }}</span>
          <span *ngIf="displayArtist && event.location"> · </span>
          <span *ngIf="event.location">{{ event.location }}</span>
        </p>
        <p class="modal-date">{{ formattedDateTime }}</p>
        <p class="modal-description" *ngIf="event.description" [innerHTML]="event.description"></p>
        <div *ngIf="event.uploaderProfile" class="modal-uploader-badge">
          <app-content-uploader-badge [profile]="event.uploaderProfile" />
        </div>
      </div>
      <a
        *ngIf="event.ticketUrl && !isPast"
        [href]="event.ticketUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="modal-ticket-btn"
        (click)="onTicketClick()">
        {{ 'shared.tickets' | translate }} ›
      </a>
    </div>

  </div>
</div>
