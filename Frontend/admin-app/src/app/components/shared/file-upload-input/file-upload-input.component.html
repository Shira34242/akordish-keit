<div class="fui-wrapper">
  <div class="fui-row">
    <input
      *ngIf="!fileOnly"
      [id]="inputId"
      type="text"
      class="fui-url-input form-input"
      [value]="url || ''"
      (input)="onUrlInput($event)"
      [attr.maxlength]="maxLength ?? null"
      [placeholder]="placeholder"
    />
    <button
      type="button"
      class="fui-pin-btn"
      [class.fui-pin-btn--text]="uploadButtonText"
      (click)="fileInput.click()"
      [disabled]="uploading"
      title="צרף קובץ"
    >
      <span class="material-icons">{{ uploading ? 'hourglass_empty' : uploadIcon }}</span>
      <span *ngIf="uploadButtonText" class="fui-pin-text">{{ uploading ? 'מעלה...' : uploadButtonText }}</span>
    </button>
    <input
      #fileInput
      type="file"
      [accept]="accept"
      [multiple]="multiple"
      (change)="onFileSelected($event)"
      style="display: none"
    />
  </div>

  <div *ngIf="uploading" class="fui-uploading" role="status" aria-live="polite">
    <div class="fui-progress-head">
      <span *ngIf="uploadTotalFiles > 1">{{ uploadCompletedFiles }} / {{ uploadTotalFiles }}</span>
      <span>מעלה קובץ</span>
      <strong>{{ uploadProgress }}%</strong>
      <button type="button" class="fui-cancel-btn" (click)="cancelUpload()">ביטול</button>
    </div>
    <div class="fui-progress-track" aria-hidden="true">
      <span [style.width.%]="uploadProgress"></span>
    </div>
  </div>

  <div *ngIf="fileOnly && url && !uploading" class="fui-file-attached">
    <span class="material-icons">check_circle</span>
    <span>קובץ צורף</span>
    <button type="button" class="fui-clear-inline" (click)="clear()" title="הסר">
      <span class="material-icons">close</span>
    </button>
  </div>

  <div *ngIf="url && isImage(url) && showPreview && !uploading" class="fui-preview">
    <img [src]="url" alt="preview" />
    <button
      *ngIf="enableImageCrop"
      type="button"
      class="fui-edit-btn"
      (click)="openCropForCurrentImage()"
      title="עריכת מיקוד">
      <span class="material-icons">tune</span>
    </button>
    <button type="button" class="fui-clear-btn" (click)="clear()" title="הסר">
      <span class="material-icons">close</span>
    </button>
  </div>
  <app-profile-image-cropper
    *ngIf="cropFile || cropUrl"
    [sourceFile]="cropFile"
    [sourceUrl]="cropUrl"
    [fileName]="cropFileName"
    (cropped)="onCropSave($event)"
    (cancel)="onCropCancel()">
  </app-profile-image-cropper>
</div>
