<div class="ticker-host" *ngIf="hasContent" [ngStyle]="hostStyle">
  <div class="ticker-band">
    <div class="ticker-track">
      <div class="ticker-copy" *ngFor="let copy of trackCopies; trackBy: trackCopy">
        <ng-container *ngFor="let title of titles; trackBy: trackTitle">
          <span class="ticker-title">{{ title }}</span>
          <span class="ticker-separator" aria-hidden="true">●</span>
        </ng-container>
      </div>
    </div>
  </div>
</div>
