<div class="pagination-container" *ngIf="totalPages > 1">
  <div class="pagination-info">
    <span class="info-text">
      {{ 'paginate.showing' | translate }} {{ startItem }}-{{ endItem }} {{ 'paginate.of' | translate }} {{ totalCount }}
    </span>
  </div>

  <div class="pagination-controls">
    <button
      class="pagination-btn"
      [disabled]="!hasPreviousPage"
      (click)="onFirstPage()"
      [title]="'paginate.first_page' | translate">
      ⟪
    </button>

    <button
      class="pagination-btn"
      [disabled]="!hasPreviousPage"
      (click)="onPreviousPage()"
      [title]="'paginate.prev_page' | translate">
      ‹
    </button>

    <div class="page-numbers">
      <button
        *ngFor="let page of visiblePages"
        class="page-btn"
        [class.active]="page === pageNumber"
        [class.ellipsis]="page === -1"
        [disabled]="page === -1"
        (click)="onPageChange(page)">
        {{ page === -1 ? '...' : page }}
      </button>
    </div>

    <button
      class="pagination-btn"
      [disabled]="!hasNextPage"
      (click)="onNextPage()"
      [title]="'paginate.next_page' | translate">
      ›
    </button>

    <button
      class="pagination-btn"
      [disabled]="!hasNextPage"
      (click)="onLastPage()"
      [title]="'paginate.last_page' | translate">
      ⟫
    </button>
  </div>
</div>
