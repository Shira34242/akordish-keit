<a class="episode-banner" [routerLink]="['/podcasts/', episode.podcastSlug, episode.slug]">

  <img
    class="banner-bg"
    width="400"
    height="270"
    [src]="(episode.thumbnailUrl | cfImage:360:82) || '/assets/default-article.png'"
    [alt]="episode.title"
    loading="lazy"
    decoding="async"
    [imgFallbackOriginal]="episode.thumbnailUrl"
    imgFallback="/assets/default-article.png">

  <div class="banner-overlay"></div>

  <div class="banner-text">
    <h3 class="banner-title">{{ episode.title }}</h3>
    <p class="banner-subtitle" *ngIf="showDescription">{{ episode.podcastName }}</p>
  </div>

  <span class="banner-arrow-btn" aria-label="לפרק">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
  </span>

</a>
