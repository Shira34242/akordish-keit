<div *ngIf="isOpen" class="modal-backdrop" (click)="handleBackdropClick($event)">
    <div class="modal-container">

        <button class="close-btn" (click)="closeModal()" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <div *ngIf="showSuccess" class="success-state">
            <div class="success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h3>{{ 'report.sent' | translate }}</h3>
            <p>{{ 'report.thanks' | translate }}</p>
        </div>

        <form *ngIf="!showSuccess" (ngSubmit)="submitReport()">

            <div class="modal-header">
                <div class="header-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path>
                        <path d="M12 9v4"></path>
                        <path d="M12 17h.01"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="modal-title">{{ 'report.title' | translate }}</h2>
                    <p class="modal-subtitle" *ngIf="contentTitle">{{ contentTitle }}</p>
                </div>
            </div>

            <div class="form-section">
                <p class="section-label">{{ 'report.what_problem' | translate }}</p>
                <div class="chip-group">
                    <label *ngFor="let type of reportTypes; trackBy: trackByReportType" class="chip">
                        <input type="radio" name="reportType" [value]="type.value"
                            [(ngModel)]="selectedReportType" />
                        <span>{{ type.labelKey | translate }}</span>
                    </label>
                </div>
            </div>

            <div class="form-section">
                <p class="section-label">{{ 'report.detail' | translate }} <span class="required">*</span></p>
                <textarea class="form-textarea" [(ngModel)]="description" name="description" rows="4"
                    [placeholder]="'report.placeholder' | translate" [disabled]="isSubmitting"
                    maxlength="1000"></textarea>
                <span class="char-count">{{ description.length }} / 1000</span>
            </div>

            <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" (click)="closeModal()" [disabled]="isSubmitting">
                    {{ 'shared.cancel' | translate }}
                </button>
                <button type="submit" class="btn-submit" [disabled]="isSubmitting || description.length < 10">
                    {{ isSubmitting ? ('report.sending' | translate) : ('report.submit' | translate) }}
                </button>
            </div>

        </form>
    </div>
</div>
