<div *ngIf="isOpen" class="modal-backdrop" (click)="handleBackdropClick($event)">
    <div class="modal-container">

        <!-- Close Button -->
        <button class="close-btn" (click)="closeModal()" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <!-- Success State -->
        <div *ngIf="showSuccess" class="success-state">
            <div class="success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h3>הדיווח נשלח!</h3>
            <p>תודה, נטפל בכך בהקדם</p>
        </div>

        <!-- Form -->
        <form *ngIf="!showSuccess" (ngSubmit)="submitReport()">

            <!-- Header -->
            <div class="modal-header">
                <div class="header-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path>
                        <path d="M12 9v4"></path>
                        <path d="M12 17h.01"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="modal-title">דיווח על בעיה</h2>
                    <p class="modal-subtitle" *ngIf="contentTitle">{{ contentTitle }}</p>
                </div>
            </div>

            <!-- Report Type Chips -->
            <div class="form-section">
                <p class="section-label">מה הבעיה?</p>
                <div class="chip-group">
                    <label *ngFor="let type of reportTypes" class="chip">
                        <input type="radio" name="reportType" [value]="type.value"
                            [(ngModel)]="selectedReportType" />
                        <span>{{ type.label }}</span>
                    </label>
                </div>
            </div>

            <!-- Description -->
            <div class="form-section">
                <p class="section-label">פירוט <span class="required">*</span></p>
                <textarea class="form-textarea" [(ngModel)]="description" name="description" rows="4"
                    placeholder="תאר את הבעיה בקצרה..." [disabled]="isSubmitting"
                    maxlength="1000"></textarea>
                <span class="char-count">{{ description.length }} / 1000</span>
            </div>

            <!-- Error -->
            <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

            <!-- Actions -->
            <div class="modal-actions">
                <button type="button" class="btn-cancel" (click)="closeModal()" [disabled]="isSubmitting">
                    ביטול
                </button>
                <button type="submit" class="btn-submit" [disabled]="isSubmitting || description.length < 10">
                    {{ isSubmitting ? 'שולח...' : 'שליחה' }}
                </button>
            </div>

        </form>
    </div>
</div>
