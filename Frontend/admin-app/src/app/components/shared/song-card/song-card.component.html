<a class="song-card" [routerLink]="songLink">
    <div class="song-card-image">
        <img [src]="song.imageUrl || 'assets/default-song.png'" [alt]="song.title" class="song-card-img" loading="lazy">
    </div>
    <div class="song-card-info">
        <span class="song-card-label">{{ 'song_card.label' | translate }}</span>
        <span class="song-card-title">{{ song.title }}</span>
        <span class="song-card-artist">{{ song.artists && song.artists.length > 0 ? song.artists[0].name : ('song_card.unknown_artist' | translate) }}</span>
        <span class="song-card-match-badge"
              *ngIf="chordMatchText"
              [class.complete]="song.knowsAllChords">
            {{ chordMatchText }}
            <span class="song-card-match-info"
                  *ngIf="chordMatchInfoText"
                  [title]="chordMatchInfoText"
                  [attr.aria-label]="'song_card.label' | translate">i</span>
        </span>
        <svg class="song-card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <polyline points="15,18 9,12 15,6"/>
        </svg>
    </div>
</a>
