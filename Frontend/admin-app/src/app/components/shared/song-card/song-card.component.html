<div class="song-card" [routerLink]="['/song', song.id]">
    <!-- Background image -->
    <img [src]="song.imageUrl || 'assets/default-song.png'" [alt]="song.title" class="song-image">

    <!-- Lime gradient overlay from right -->
    <div class="card-overlay"></div>

    <!-- Content -->
    <div class="card-content">
        <span class="card-label">אקורדים לשיר</span>
        <h3 class="card-title">{{ song.title }}</h3>
        <p class="card-artist">{{ song.artists && song.artists.length > 0 ? song.artists[0].name : 'אמן לא ידוע' }}</p>
        <div class="card-arrow">
            <span class="material-icons">arrow_back</span>
        </div>
    </div>

</div>
